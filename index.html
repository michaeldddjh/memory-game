<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>大麦记忆翻牌</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:root{
  --cols:5;
  --rows:8;
  --gap:3px;
  --gold:#ffd700;
  --accent:#c44dff;
  --pink:#ff6b9d;
  --cyan:#4dffc3;
  --radius:8px;
}
html{height:100%}
body{
  min-height:100%;
  min-height:100dvh;
  overflow-x:hidden;
  overflow-y:auto;
}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:linear-gradient(135deg,#0a0015 0%,#1a0030 30%,#0d0020 60%,#150028 100%);
  color:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  user-select:none;
  -webkit-user-select:none;
}
@keyframes hologram{0%{background-position:0% 50%}100%{background-position:300% 50%}}
@keyframes matchPulse{0%{transform:scale(1);box-shadow:0 0 0 rgba(77,255,195,0)}50%{transform:scale(1.05);box-shadow:0 0 16px rgba(77,255,195,.6)}100%{transform:scale(1);box-shadow:0 0 0 rgba(77,255,195,0)}}
@keyframes shake{0%,100%{transform:translateX(0) rotateY(180deg)}20%,60%{transform:translateX(-3px) rotateY(180deg)}40%,80%{transform:translateX(3px) rotateY(180deg)}}
@keyframes confetti{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
@keyframes glow{0%,100%{text-shadow:0 0 8px rgba(255,215,0,.3)}50%{text-shadow:0 0 20px rgba(255,215,0,.7)}}
@keyframes starTwinkle{0%,100%{opacity:.2}50%{opacity:.7}}
@keyframes particleBurst{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(0)}}
@keyframes breathe{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes slideUp{0%{transform:translateY(20px);opacity:0}100%{transform:translateY(0);opacity:1}}

/* Header */
.header{
  text-align:center;
  padding:6px 0 2px;
  flex-shrink:0;
}
.header h1{
  font-size:1.1em;
  background:linear-gradient(90deg,var(--gold),var(--pink),var(--cyan),var(--gold));
  background-size:300%;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:hologram 4s linear infinite,glow 3s ease-in-out infinite;
  letter-spacing:2px;
}

/* Stats bar */
.stats{
  display:none;
  justify-content:space-around;
  width:100%;
  max-width:400px;
  padding:4px 8px;
  font-size:.8em;
  flex-shrink:0;
}
.stats .stat{text-align:center}
.stats .val{font-size:1.1em;font-weight:bold;color:var(--cyan)}

/* Game grid - CRITICAL: card size driven by viewport WIDTH */
#grid{
  display:grid;
  grid-template-columns:repeat(var(--cols),1fr);
  gap:var(--gap);
  padding:4px;
  width:100%;
  flex:none;
  align-content:start;
}

/* Card */
.card{
  aspect-ratio:1/1;
  perspective:600px;
  cursor:pointer;
  position:relative;
}
.card-inner{
  width:100%;height:100%;
  position:relative;
  transform-style:preserve-3d;
  transition:transform .35s ease;
}
.card.flipped .card-inner,
.card.matched .card-inner{
  transform:rotateY(180deg);
}

.card-face{
  position:absolute;
  width:100%;height:100%;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  border-radius:var(--radius);
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* Card back - hologram */
.card-back{
  background:linear-gradient(135deg,
    #ff6b9d 0%,#c44dff 15%,#6b9dff 30%,
    #4dffc3 45%,#ffd700 60%,#ff6b9d 75%,
    #c44dff 90%,#6b9dff 100%);
  background-size:300% 300%;
  animation:hologram 3s linear infinite;
  border:2px solid rgba(255,215,0,.5);
  flex-direction:column;
  gap:0;
}
.cb-diamond{font-size:.7em;color:rgba(255,255,255,.7)}
.cb-text{
  font-size:.85em;font-weight:900;
  color:#fff;
  text-shadow:0 0 10px rgba(255,215,0,.8),0 1px 2px rgba(0,0,0,.5);
  letter-spacing:3px;
}
.cb-sub{
  font-size:.4em;font-weight:600;
  color:rgba(255,255,255,.85);
  letter-spacing:4px;
}

/* Card front - portrait */
.card-front{
  transform:rotateY(180deg);
  background:#111;
  border:2px solid rgba(255,255,255,.1);
}
.card-front img{
  width:100%;height:100%;
  object-fit:cover;
  border-radius:calc(var(--radius) - 2px);
}

/* Matched card glow */
.card.matched .card-front{
  border-color:var(--cyan);
  animation:matchPulse 1.5s ease-in-out infinite;
}
.card.matched{
  pointer-events:none;
}

/* Wrong shake */
.card.wrong .card-inner{
  animation:shake .4s ease;
}

/* Controls */
.controls{
  display:flex;
  gap:8px;
  padding:6px 0;
  flex-shrink:0;
}
.btn{
  padding:8px 16px;
  border:none;
  border-radius:20px;
  font-size:.85em;
  font-weight:bold;
  cursor:pointer;
  color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--pink));
  box-shadow:0 2px 8px rgba(196,77,255,.3);
  transition:transform .15s,box-shadow .15s;
}
.btn:active{transform:scale(.95);box-shadow:none}

/* PK Banner */
.pk-banner{
  display:none;
  width:100%;
  max-width:400px;
  padding:6px 12px;
  margin:2px 0;
  background:linear-gradient(90deg,#ff4d4d,#c44dff);
  border-radius:8px;
  text-align:center;
  font-size:.8em;
  animation:breathe 2s ease-in-out infinite;
  flex-shrink:0;
}
.pk-banner.show{display:block}

/* Modals */
.modal{
  display:none;
  position:fixed;
  top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,.8);
  z-index:100;
  align-items:center;
  justify-content:center;
}
.modal.show{display:flex}
.modal-box{
  background:linear-gradient(135deg,#1a0030,#0d0020);
  border:1px solid rgba(196,77,255,.3);
  border-radius:16px;
  padding:20px;
  max-width:360px;
  width:90%;
  max-height:80vh;
  overflow-y:auto;
  animation:slideUp .3s ease;
}
.modal-box h2{
  text-align:center;
  margin-bottom:12px;
  color:var(--gold);
}
.modal-box input{
  width:100%;
  padding:8px 12px;
  border:1px solid rgba(196,77,255,.4);
  border-radius:8px;
  background:rgba(255,255,255,.05);
  color:#fff;
  font-size:1em;
  margin:8px 0;
}

/* Leaderboard table */
.lb-table{width:100%;border-collapse:collapse;font-size:.75em;margin:4px 0}
.lb-table th{color:var(--gold);padding:3px;text-align:left;border-bottom:1px solid rgba(255,215,0,.2)}
.lb-table td{padding:3px;border-bottom:1px solid rgba(255,255,255,.05)}
.lb-table tr.me td{color:var(--cyan);font-weight:bold}
.lb-cols{display:flex;gap:8px;overflow-x:auto}
.lb-col{flex:1;min-width:150px}
.lb-title{color:var(--accent);font-size:.8em;font-weight:bold;margin:4px 0}
.lb-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px;justify-content:center}
.lb-tab{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.6);border-radius:12px;padding:3px 10px;font-size:.7em;cursor:pointer;transition:all .2s}
.lb-tab:hover{background:rgba(255,255,255,.15);color:#fff}
.lb-tab.active{background:var(--accent);color:#000;border-color:var(--accent);font-weight:bold}
.lb-spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle}

/* Win modal extras */
.result-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin:12px 0;
  text-align:center;
}
.result-item .label{font-size:.7em;color:rgba(255,255,255,.5)}
.result-item .value{font-size:1.3em;font-weight:bold;color:var(--cyan)}
.rating{font-size:2.5em;text-align:center;margin:8px 0}
.rating-letter{font-size:1.5em;font-weight:bold;color:var(--gold)}
.pk-result{
  text-align:center;
  padding:8px;
  border-radius:8px;
  margin:8px 0;
  font-weight:bold;
}
.pk-win{background:rgba(77,255,195,.15);color:var(--cyan)}
.pk-lose{background:rgba(255,107,157,.15);color:var(--pink)}

/* Stars background */
.star{
  position:fixed;
  width:1px;height:1px;
  background:#fff;
  border-radius:50%;
  animation:starTwinkle var(--dur,3s) ease-in-out var(--delay,0s) infinite;
  pointer-events:none;
  z-index:0;
}

/* Confetti canvas */
#confetti{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  pointer-events:none;
  z-index:99;
}

/* Particles */
.particle{
  position:fixed;
  width:6px;height:6px;
  border-radius:50%;
  pointer-events:none;
  z-index:50;
  animation:particleBurst .6s ease-out forwards;
}

/* Toast */
.toast{
  position:fixed;
  bottom:80px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.85);
  color:#fff;
  padding:8px 20px;
  border-radius:20px;
  font-size:.85em;
  z-index:200;
  opacity:0;
  transition:opacity .3s;
}
.toast.show{opacity:1}

/* ===== Responsive: card size from viewport width ===== */
/* Phone: grid fills screen width, cards sized by available width */
@media(max-width:600px){
  body{padding:0 4px}
  #grid{
    width:100%;
    max-width:none;
  }
  .header h1{font-size:.95em}
  .stats{font-size:.7em; max-width:none}
  .controls{gap:6px}
  .btn{padding:6px 12px;font-size:.78em}
}
/* Very small phones (iPhone SE, etc.) */
@media(max-width:380px){
  :root{--gap:2px}
  #grid{
    width:100%;
    max-width:none;
  }
  .cb-text{font-size:.65em}
  .cb-sub{font-size:.3em}
  .stats{font-size:.65em}
  .header{padding:4px 0 1px}
  .header h1{font-size:.85em}
}
/* Tablet / desktop: cap grid width so cards aren't huge */
@media(min-width:601px){
  #grid{
    max-width:440px;
  }
}

/* Difficulty selector */
.diff-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin:16px 0;
}
.diff-btn{
  padding:12px 8px;
  border:2px solid rgba(196,77,255,.3);
  border-radius:12px;
  background:rgba(255,255,255,.04);
  color:#fff;
  cursor:pointer;
  transition:all .2s;
  text-align:center;
}
.diff-btn:hover,.diff-btn:active{
  border-color:var(--cyan);
  background:rgba(77,255,195,.08);
  transform:scale(1.03);
}
.diff-btn .diff-size{
  font-size:1.3em;
  font-weight:bold;
  color:var(--gold);
  margin-bottom:4px;
}
.diff-btn .diff-label{
  font-size:.75em;
  color:rgba(255,255,255,.6);
}
.diff-btn .diff-pairs{
  font-size:.65em;
  color:var(--cyan);
  margin-top:2px;
}
.diff-btn.selected{
  border-color:var(--cyan);
  background:rgba(77,255,195,.15);
  box-shadow:0 0 12px rgba(77,255,195,.3);
}
</style>
</head>
<body>

<!-- Stars -->
<div id="stars"></div>

<!-- Header -->
<div class="header">
  <h1>◆ 大麦记忆翻牌 ◆</h1>
</div>

<!-- PK Banner -->
<div id="pkBanner" class="pk-banner">
  ⚔️ <span id="pkName"></span> 向你发起挑战！【<span id="pkDiffLabel"></span>】
  <span id="pkSteps"></span>步 / <span id="pkTime"></span>
</div>

<!-- Stats -->
<div id="stats" class="stats">
  <div class="stat"><div class="label">👣 步数</div><div class="val" id="stepsVal">0</div></div>
  <div class="stat"><div class="label">⏱️ 时间</div><div class="val" id="timeVal">0:00</div></div>
  <div class="stat"><div class="label">🎯 配对</div><div class="val" id="matchVal">0/8</div></div>
</div>

<!-- Game Grid -->
<div id="grid"></div>

<!-- Controls -->
<div id="gameControls" class="controls">
  <button class="btn" onclick="showDifficulty()">🎮 开始游戏</button>
  <button class="btn" onclick="showLeaderboard()">🏆 排行榜</button>
  <button class="btn" id="bgmBtn" onclick="toggleBGM()">🎵</button>
</div>

<!-- Confetti -->
<canvas id="confetti"></canvas>

<!-- Win Modal -->
<div id="winModal" class="modal">
  <div class="modal-box">
    <h2 id="ratingEmoji">🌟</h2>
    <div class="rating"><span class="rating-letter" id="finalRating">S</span></div>
    <div class="result-grid">
      <div class="result-item"><div class="label">步数</div><div class="value" id="finalSteps">0</div></div>
      <div class="result-item"><div class="label">时间</div><div class="value" id="finalTime">0:00</div></div>
    </div>
    <div id="pkResult" class="pk-result" style="display:none"></div>
    <input id="nameInput" placeholder="输入昵称保存记录" maxlength="10">
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="btn" style="flex:1" onclick="saveAndShare()">📤 分享PK</button>
      <button class="btn" style="flex:1" onclick="closeWin();showDifficulty()">🔄 再来一局</button>
    </div>
    <div id="winLeaderboard" style="margin-top:12px"></div>
  </div>
</div>

<!-- Leaderboard Modal -->
<div id="lbModal" class="modal">
  <div class="modal-box">
    <h2>🏆 全球排行榜</h2>
    <div id="lbContent"></div>
    <button class="btn" style="width:100%;margin-top:12px" onclick="closeLb()">关闭</button>
  </div>
</div>

<!-- Difficulty Modal -->
<div id="diffModal" class="modal">
  <div class="modal-box">
    <h2>🎯 选择难度</h2>
    <div class="diff-grid">
      <div class="diff-btn selected" data-diff="4x4" onclick="selectDiff(this)">
        <div class="diff-size">4×4</div>
        <div class="diff-label">轻松入门</div>
        <div class="diff-pairs">8对</div>
      </div>
      <div class="diff-btn" data-diff="4x6" onclick="selectDiff(this)">
        <div class="diff-size">4×6</div>
        <div class="diff-label">小试牛刀</div>
        <div class="diff-pairs">12对</div>
      </div>
      <div class="diff-btn" data-diff="4x8" onclick="selectDiff(this)">
        <div class="diff-size">4×8</div>
        <div class="diff-label">渐入佳境</div>
        <div class="diff-pairs">16对</div>
      </div>
      <div class="diff-btn" data-diff="5x6" onclick="selectDiff(this)">
        <div class="diff-size">5×6</div>
        <div class="diff-label">挑战记忆</div>
        <div class="diff-pairs">15对</div>
      </div>
      <div class="diff-btn" data-diff="5x8" onclick="selectDiff(this)">
        <div class="diff-size">5×8</div>
        <div class="diff-label">地狱模式</div>
        <div class="diff-pairs">20对</div>
      </div>
    </div>
    <button class="btn" style="width:100%" onclick="confirmDiff()">🚀 开始挑战</button>
    <button class="btn" style="width:100%;margin-top:8px;background:rgba(255,255,255,.1);box-shadow:none" onclick="closeDiff()">返回</button>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="toast"></div>

const TOTAL_AVATARS = 20;
const DIFFICULTIES = {
  '4x4': {cols:4, rows:4, pairs:8},
  '4x6': {cols:4, rows:6, pairs:12},
  '4x8': {cols:4, rows:8, pairs:16},
  '5x6': {cols:5, rows:6, pairs:15},
  '5x8': {cols:5, rows:8, pairs:20}
};
let PAIRS = 8;
let COLS = 4;
let ROWS = 4;
let selectedDiff = '4x4';

// ===== STATE =====
let cards = [];
let flippedCards = [];
let matchedPairs = 0;
let steps = 0;
let gameTimer = null;
let elapsed = 0;
let gameActive = false;
let canFlip = true;
let audioCtx = null;
let bgmOn = true;
let bgmInterval = null;

// ===== PK PARAMS =====
const urlParams = new URLSearchParams(window.location.search);
const pkName = urlParams.get('pk_name') || '';
const pkSteps = parseInt(urlParams.get('pk_steps')) || 0;
const pkTime = parseFloat(urlParams.get('pk_time')) || 0;
const pkDiff = urlParams.get('pk_diff') || '';
const isPK = pkName && pkSteps > 0;
// Auto-set difficulty from PK link
if (pkDiff && DIFFICULTIES[pkDiff]) {
  selectedDiff = pkDiff;
}

// ===== FORMAT TIME =====
function fmtTime(s) {
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return m + ':' + (sec < 10 ? '0' : '') + sec;
}

// ===== DIFFICULTY SELECTION =====
function showDifficulty() {
  // Sync visual selection with current selectedDiff
  document.querySelectorAll('.diff-btn').forEach(function(b) {
    b.classList.toggle('selected', b.dataset.diff === selectedDiff);
  });
  document.getElementById('diffModal').classList.add('show');
}

function selectDiff(el) {
  document.querySelectorAll('.diff-btn').forEach(function(b){ b.classList.remove('selected'); });
  el.classList.add('selected');
  selectedDiff = el.dataset.diff;
}

function closeDiff() {
  document.getElementById('diffModal').classList.remove('show');
}

function confirmDiff() {
  var d = DIFFICULTIES[selectedDiff];
  PAIRS = d.pairs;
  COLS = d.cols;
  ROWS = d.rows;
  document.documentElement.style.setProperty('--cols', COLS);
  document.documentElement.style.setProperty('--rows', ROWS);
  closeDiff();
  startGame();
}

// ===== INIT =====
window.addEventListener('DOMContentLoaded', function() {
  // Apply difficulty from PK link or default
  var d = DIFFICULTIES[selectedDiff];
  PAIRS = d.pairs; COLS = d.cols; ROWS = d.rows;
  document.documentElement.style.setProperty('--cols', COLS);
  document.documentElement.style.setProperty('--rows', ROWS);

  if (isPK) {
    document.getElementById('pkBanner').classList.add('show');
    document.getElementById('pkName').textContent = decodeURIComponent(pkName);
    document.getElementById('pkSteps').textContent = pkSteps;
    document.getElementById('pkTime').textContent = fmtTime(pkTime);
    document.getElementById('pkDiffLabel').textContent = selectedDiff.replace('x','×');
  }
  createStars();
  buildGrid();
  if (isPK) startGame();
});

function createStars() {
  var c = document.getElementById('stars');
  for (var i = 0; i < 40; i++) {
    var s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random()*100 + '%';
    s.style.top = Math.random()*100 + '%';
    s.style.setProperty('--dur', (2+Math.random()*4)+'s');
    s.style.setProperty('--delay', Math.random()*3+'s');
    s.style.width = s.style.height = (1+Math.random()*2)+'px';
    c.appendChild(s);
  }
}

function buildGrid() {
  var grid = document.getElementById('grid');
  grid.innerHTML = '';
  cards = [];
  // Randomly select PAIRS avatars from the pool of 20
  var pool = AVATARS.slice();
  shuffle(pool);
  var chosen = pool.slice(0, PAIRS);
  for (var i = 0; i < PAIRS; i++) {
    cards.push({id: i, avatar: chosen[i], matched: false});
    cards.push({id: i, avatar: chosen[i], matched: false});
  }
  shuffle(cards);
  for (var idx = 0; idx < cards.length; idx++) {
    var c = cards[idx];
    var el = document.createElement('div');
    el.className = 'card';
    el.dataset.idx = idx;
    el.innerHTML = '<div class="card-inner"><div class="card-face card-back"><span class="cb-diamond">◆</span><div class="cb-text">大麦</div><div class="cb-sub">MEMORY</div></div><div class="card-face card-front"><img src="' + c.avatar + '" alt="头像"></div></div>';
    // Use both click and touchstart for mobile
    el.addEventListener('click', handleCardClick);
    grid.appendChild(el);
  }
}

function handleCardClick(e) {
  e.preventDefault();
  e.stopPropagation();
  var el = e.currentTarget;
  var idx = parseInt(el.dataset.idx);
  flipCard(idx, el);
}

function shuffle(arr) {
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
}

// ===== GAME LOGIC =====
function startGame() {
  matchedPairs = 0;
  steps = 0;
  elapsed = 0;
  flippedCards = [];
  gameActive = true;
  canFlip = true;

  document.documentElement.style.setProperty('--cols', COLS);
  document.documentElement.style.setProperty('--rows', ROWS);
  document.getElementById('stats').style.display = 'flex';
  document.getElementById('stepsVal').textContent = '0';
  document.getElementById('timeVal').textContent = '0:00';
  document.getElementById('matchVal').textContent = '0/' + PAIRS;
  document.getElementById('gameControls').style.display = 'none';

  // Build grid with randomly selected portraits
  buildGrid();

  if (gameTimer) clearInterval(gameTimer);
  gameTimer = setInterval(function() {
    elapsed++;
    document.getElementById('timeVal').textContent = fmtTime(elapsed);
  }, 1000);

  initAudio();
  startBGM();
}

function flipCard(idx, el) {
  if (!gameActive || !canFlip) return;
  if (el.classList.contains('flipped') || el.classList.contains('matched')) return;
  if (flippedCards.length >= 2) return;

  el.classList.add('flipped');
  flippedCards.push({idx: idx, el: el, id: cards[idx].id});
  playSound('flip');

  if (flippedCards.length === 2) {
    steps++;
    document.getElementById('stepsVal').textContent = steps;
    canFlip = false;

    var a = flippedCards[0], b = flippedCards[1];
    if (a.id === b.id) {
      setTimeout(function() {
        a.el.classList.add('matched');
        b.el.classList.add('matched');
        cards[a.idx].matched = true;
        cards[b.idx].matched = true;
        matchedPairs++;
        document.getElementById('matchVal').textContent = matchedPairs + '/' + PAIRS;
        playSound('match');
        spawnParticles(a.el);
        spawnParticles(b.el);
        flippedCards = [];
        canFlip = true;
        if (matchedPairs === PAIRS) gameWon();
      }, 350);
    } else {
      setTimeout(function() {
        a.el.classList.add('wrong');
        b.el.classList.add('wrong');
        playSound('wrong');
      }, 350);
      setTimeout(function() {
        a.el.classList.remove('flipped', 'wrong');
        b.el.classList.remove('flipped', 'wrong');
        flippedCards = [];
        canFlip = true;
      }, 900);
    }
  }
}

function gameWon() {
  gameActive = false;
  clearInterval(gameTimer);
  stopBGM();
  playSound('win');
  launchConfetti();

  var rating = getRating(steps);
  document.getElementById('ratingEmoji').textContent = rating.emoji;
  document.getElementById('finalSteps').textContent = steps;
  document.getElementById('finalTime').textContent = fmtTime(elapsed);
  document.getElementById('finalRating').textContent = rating.letter;

  if (isPK) {
    var pkEl = document.getElementById('pkResult');
    var won = steps < pkSteps || (steps === pkSteps && elapsed < pkTime);
    pkEl.style.display = 'block';
    pkEl.className = 'pk-result ' + (won ? 'pk-win' : 'pk-lose');
    pkEl.textContent = won
      ? '🎉 你赢了！你比 ' + decodeURIComponent(pkName) + ' 更快！'
      : '💪 继续加油！' + decodeURIComponent(pkName) + ' 用了 ' + pkSteps + ' 步';
  }

  loadAndRenderLB('winLeaderboard', true);
  setTimeout(function() {
    document.getElementById('winModal').classList.add('show');
  }, 600);
}

function getRating(s) {
  // Scale thresholds proportionally to pair count (original was for 20 pairs)
  var scale = PAIRS / 20;
  if (s <= Math.round(28 * scale)) return {letter: 'S', emoji: '🌟'};
  if (s <= Math.round(38 * scale)) return {letter: 'A', emoji: '⭐'};
  if (s <= Math.round(55 * scale)) return {letter: 'B', emoji: '👍'};
  return {letter: 'C', emoji: '💪'};
}

function closeWin() {
  document.getElementById('winModal').classList.remove('show');
}

// ===== LEADERBOARD (Supabase Remote) =====
var SB_URL = 'https://oeyieqhiosvgefhkyrlv.supabase.co/rest/v1';
var SB_KEY = 'sb_publishable_oDndPkqdWgBtnSNNcbCMHA_mx78o8u0';
var lbCurrentTab = 'all'; // 'all','4x4','4x6','4x8','5x6','5x8'
var lbCached = null; // cache fetched data

function sbHeaders() {
  return {
    'apikey': SB_KEY,
    'Authorization': 'Bearer ' + SB_KEY,
    'Content-Type': 'application/json',
    'Prefer': 'return=representation'
  };
}

// Fetch leaderboard from Supabase
function fetchRemoteLB(diff, limit) {
  limit = limit || 20;
  var url = SB_URL + '/leaderboard?select=name,steps,time,difficulty,rating,created_at&order=steps.asc,time.asc&limit=' + limit;
  if (diff && diff !== 'all') {
    url += '&difficulty=eq.' + diff;
  }
  return fetch(url, { headers: sbHeaders() })
    .then(function(r) { return r.json(); })
    .catch(function() { return []; });
}

// Save to Supabase (async, non-blocking)
function saveToRemoteLB(name, s, t) {
  var diffLabel = DIFFICULTIES[selectedDiff] ? (selectedDiff.replace('x','×')) : '5×8';
  var rating = getRating(s).letter;
  // Save to Supabase
  fetch(SB_URL + '/leaderboard', {
    method: 'POST',
    headers: sbHeaders(),
    body: JSON.stringify({ name: name, steps: s, time: t, difficulty: selectedDiff, rating: rating })
  }).catch(function(err) {
    console.warn('Supabase save failed, using localStorage fallback', err);
    // Fallback: save to localStorage
    saveToLocalLB(name, s, t);
  });
  // Also save locally as backup
  saveToLocalLB(name, s, t);
}

// Local fallback
function getLB() {
  try { return JSON.parse(localStorage.getItem('dm_lb') || '{"steps":[],"time":[]}'); }
  catch(e) { return {"steps":[],"time":[]}; }
}

function saveToLocalLB(name, s, t) {
  var lb = getLB();
  var diffLabel = DIFFICULTIES[selectedDiff] ? (selectedDiff.replace('x','×')) : '5×8';
  var entry = {name: name, steps: s, time: t, diff: diffLabel, difficulty: selectedDiff, date: new Date().toLocaleDateString('zh-CN')};
  lb.steps.push(entry);
  lb.steps.sort(function(a,b){ return a.steps - b.steps || a.time - b.time; });
  lb.steps = lb.steps.slice(0, 10);
  lb.time.push(Object.assign({}, entry));
  lb.time.sort(function(a,b){ return a.time - b.time || a.steps - b.steps; });
  lb.time = lb.time.slice(0, 10);
  localStorage.setItem('dm_lb', JSON.stringify(lb));
}

// Render difficulty tabs
function renderLbTabs() {
  var tabs = [
    {key:'all', label:'🏅 全部'},
    {key:'4x4', label:'4×4'},
    {key:'4x6', label:'4×6'},
    {key:'4x8', label:'4×8'},
    {key:'5x6', label:'5×6'},
    {key:'5x8', label:'5×8'}
  ];
  var html = '<div class="lb-tabs">';
  tabs.forEach(function(t) {
    var cls = 'lb-tab' + (lbCurrentTab === t.key ? ' active' : '');
    html += '<button class="' + cls + '" onclick="switchLbTab(\'' + t.key + '\')">' + t.label + '</button>';
  });
  html += '</div>';
  return html;
}

// Render leaderboard from data array
function renderLbFromData(data, isWin) {
  if (!data || data.length === 0) {
    return '<div style="text-align:center;color:rgba(255,255,255,.3);font-size:.8em;padding:12px">暂无记录，等你来创造！🏆</div>';
  }
  // Separate by steps sort and time sort (data is already sorted by steps,time)
  var stepsData = data.slice(0, 20);
  var timeData = data.slice().sort(function(a,b){ return a.time - b.time || a.steps - b.steps; }).slice(0, 20);

  var html = '<div class="lb-cols">';
  html += '<div class="lb-col"><div class="lb-title">👣 最少步数 TOP20</div>';
  html += '<table class="lb-table"><tr><th>#</th><th>昵称</th><th>难度</th><th>步数</th><th>时间</th></tr>';
  stepsData.forEach(function(e, i) {
    var hl = (isWin && e.steps === steps && e.time === elapsed) ? ' class="me"' : '';
    var diff = (e.difficulty || '5x8').replace('x','×');
    html += '<tr' + hl + '><td>' + (i+1) + '</td><td>' + e.name + '</td><td>' + diff + '</td><td>' + e.steps + '</td><td>' + fmtTime(e.time) + '</td></tr>';
  });
  html += '</table></div>';
  html += '<div class="lb-col"><div class="lb-title">⏱️ 最快时间 TOP20</div>';
  html += '<table class="lb-table"><tr><th>#</th><th>昵称</th><th>难度</th><th>时间</th><th>步数</th></tr>';
  timeData.forEach(function(e, i) {
    var hl = (isWin && e.steps === steps && e.time === elapsed) ? ' class="me"' : '';
    var diff = (e.difficulty || '5x8').replace('x','×');
    html += '<tr' + hl + '><td>' + (i+1) + '</td><td>' + e.name + '</td><td>' + diff + '</td><td>' + fmtTime(e.time) + '</td><td>' + e.steps + '</td></tr>';
  });
  html += '</table></div></div>';
  return html;
}

// Render leaderboard (sync wrapper for win modal)
function renderLeaderboard(isWin) {
  // If we have cached remote data, use it
  if (lbCached && lbCached.length > 0) {
    var filtered = lbCurrentTab === 'all' ? lbCached : lbCached.filter(function(e) { return e.difficulty === lbCurrentTab; });
    return renderLbTabs() + renderLbFromData(filtered, isWin);
  }
  // Fallback to local
  var lb = getLB();
  if (lb.steps.length === 0 && lb.time.length === 0) {
    return renderLbTabs() + '<div style="text-align:center;color:rgba(255,255,255,.3);font-size:.8em;padding:12px">暂无记录，等你来创造！🏆</div>';
  }
  // Convert local format to remote-like format
  var localData = lb.steps.map(function(e) {
    return { name: e.name, steps: e.steps, time: e.time, difficulty: e.difficulty || (e.diff||'5x8').replace('×','x'), rating: '' };
  });
  return renderLbTabs() + renderLbFromData(localData, isWin);
}

// Async: fetch from Supabase and render
function loadAndRenderLB(containerId, isWin) {
  var el = document.getElementById(containerId);
  if (!el) return;
  el.innerHTML = renderLbTabs() + '<div style="text-align:center;padding:16px;color:rgba(255,255,255,.4)"><span class="lb-spinner"></span> 加载全球排行榜中...</div>';

  fetchRemoteLB('all', 100).then(function(data) {
    lbCached = data;
    var filtered = lbCurrentTab === 'all' ? data : data.filter(function(e) { return e.difficulty === lbCurrentTab; });
    el.innerHTML = renderLbTabs() + renderLbFromData(filtered, isWin);
  }).catch(function() {
    // Fallback to local
    el.innerHTML = renderLeaderboard(isWin);
  });
}

// Switch difficulty tab
function switchLbTab(tab) {
  lbCurrentTab = tab;
  // Re-render whichever container is visible
  var lbContent = document.getElementById('lbContent');
  var winLb = document.getElementById('winLeaderboard');
  if (document.getElementById('lbModal').classList.contains('show') && lbContent) {
    loadAndRenderLB('lbContent', false);
  } else if (winLb) {
    loadAndRenderLB('winLeaderboard', true);
  }
}

function showLeaderboard() {

  loadAndRenderLB('lbContent', false);
}

function closeLb() {

function saveAndShare() {

// ===== AUDIO (Web Audio API - no external files needed) =====
function initAudio() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  } catch(e) { audioCtx = null; }
}

function startBGM() {
  if (!bgmOn || !audioCtx) return;
  stopBGM();
  // Synthesize a simple looping melody
  var melody = [262, 294, 330, 349, 392, 349, 330, 294]; // C D E F G F E D
  var noteIdx = 0;
  bgmInterval = setInterval(function() {
    if (!bgmOn || !audioCtx || audioCtx.state === 'closed') { stopBGM(); return; }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    try {
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = 'sine';
      o.frequency.value = melody[noteIdx % melody.length];
      var now = audioCtx.currentTime;
      g.gain.setValueAtTime(0.03, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
      o.connect(g);
      g.connect(audioCtx.destination);
      o.start(now);
      o.stop(now + 0.4);
      noteIdx++;
    } catch(e) {}
  }, 500);
}

function stopBGM() {
  if (bgmInterval) { clearInterval(bgmInterval); bgmInterval = null; }
}

function toggleBGM() {
  bgmOn = !bgmOn;
  document.getElementById('bgmBtn').textContent = bgmOn ? '🎵' : '🔇';
  if (bgmOn && gameActive) {
    startBGM();
  } else {
    stopBGM();
  }
}

function playSound(type) {
  if (!audioCtx) initAudio();
  if (!audioCtx) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  var now = audioCtx.currentTime;
  try {
    if (type === 'flip') {
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = 800;
      g.gain.setValueAtTime(0.08, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(now); o.stop(now + 0.08);
    } else if (type === 'match') {
      [523, 659, 784].forEach(function(f, i) {
        var o = audioCtx.createOscillator();
        var gg = audioCtx.createGain();
        o.type = 'sine'; o.frequency.value = f;
        gg.gain.setValueAtTime(0.1, now + i*0.1);
        gg.gain.exponentialRampToValueAtTime(0.001, now + i*0.1 + 0.15);
        o.connect(gg); gg.connect(audioCtx.destination);
        o.start(now + i*0.1); o.stop(now + i*0.1 + 0.15);
      });
    } else if (type === 'wrong') {
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = 'sawtooth'; o.frequency.value = 200;
      g.gain.setValueAtTime(0.06, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(now); o.stop(now + 0.2);
    } else if (type === 'win') {
      [523, 659, 784, 1047].forEach(function(f, i) {
        var o = audioCtx.createOscillator();
        var gg = audioCtx.createGain();
        o.type = 'sine'; o.frequency.value = f;
        gg.gain.setValueAtTime(0.12, now + i*0.15);
        gg.gain.exponentialRampToValueAtTime(0.001, now + i*0.15 + 0.3);
        o.connect(gg); gg.connect(audioCtx.destination);
        o.start(now + i*0.15); o.stop(now + i*0.15 + 0.3);
      });
    }
  } catch(e) {}
}

// ===== EFFECTS =====
function spawnParticles(el) {
  var rect = el.getBoundingClientRect();
  var cx = rect.left + rect.width/2;
  var cy = rect.top + rect.height/2;
  var colors = ['#ff6b9d','#c44dff','#6b9dff','#4dffc3','#ffd84d'];
  for (var i = 0; i < 8; i++) {
    var p = document.createElement('div');
    p.className = 'particle';
    var angle = (Math.PI * 2 / 8) * i;
    var dist = 20 + Math.random() * 30;
    p.style.left = cx + 'px';
    p.style.top = cy + 'px';
    p.style.background = colors[i % colors.length];
    p.style.setProperty('--dx', Math.cos(angle)*dist + 'px');
    p.style.setProperty('--dy', Math.sin(angle)*dist + 'px');
    document.body.appendChild(p);
    setTimeout(function(){ p.remove(); }, 600);
  }
}

function launchConfetti() {
  var canvas = document.getElementById('confetti');
  var ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  var particles = [];
  var colors = ['#ff6b9d','#c44dff','#6b9dff','#4dffc3','#ffd84d','#ff4d4d','#4dff4d'];
  for (var i = 0; i < 60; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: -20 - Math.random() * 200,
      w: 3 + Math.random() * 5,
      h: 5 + Math.random() * 8,
      color: colors[Math.floor(Math.random() * colors.length)],
      vx: -2 + Math.random() * 4,
      vy: 2 + Math.random() * 4,
      rot: Math.random() * 360,
      vr: -5 + Math.random() * 10
    });
  }
  var frame = 0;
  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    var alive = false;
    particles.forEach(function(p) {
      if (p.y < canvas.height + 20) alive = true;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI / 180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
    });
    frame++;
    if (alive && frame < 300) requestAnimationFrame(animate);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  animate();
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2500);
}
