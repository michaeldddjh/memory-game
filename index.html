<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>✦ 大麦记忆 ✦</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif}
body{
  background: linear-gradient(135deg, #0a0015 0%, #0d0025 20%, #120038 40%, #0d0030 60%, #080020 80%, #050010 100%);
  color:#e8e0f0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  position:relative;
}
/* Starfield background */
body::before{
  content:''; position:fixed; top:0;left:0;width:100%;height:100%;z-index:0;
  background:
    radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.4), transparent),
    radial-gradient(1px 1px at 30% 50%, rgba(200,180,255,0.3), transparent),
    radial-gradient(1.5px 1.5px at 50% 10%, rgba(255,255,255,0.5), transparent),
    radial-gradient(1px 1px at 70% 70%, rgba(180,160,255,0.3), transparent),
    radial-gradient(1px 1px at 90% 30%, rgba(255,255,255,0.4), transparent),
    radial-gradient(1.5px 1.5px at 20% 80%, rgba(200,180,255,0.3), transparent),
    radial-gradient(1px 1px at 80% 90%, rgba(255,255,255,0.4), transparent),
    radial-gradient(1px 1px at 45% 65%, rgba(180,160,255,0.2), transparent),
    radial-gradient(1px 1px at 60% 40%, rgba(255,255,255,0.3), transparent),
    radial-gradient(1px 1px at 15% 55%, rgba(200,180,255,0.2), transparent);
  pointer-events:none;
}
/* Animated gradient overlay */
body::after{
  content:''; position:fixed; top:-50%;left:-50%;width:200%;height:200%;z-index:0;
  background: radial-gradient(ellipse at 30% 40%, rgba(80,40,120,0.08) 0%, transparent 60%),
              radial-gradient(ellipse at 70% 60%, rgba(40,60,120,0.06) 0%, transparent 60%);
  animation: bgFloat 20s ease-in-out infinite;
  pointer-events:none;
}
@keyframes bgFloat{
  0%,100%{transform:translate(0,0) rotate(0deg)}
  50%{transform:translate(-2%,2%) rotate(1deg)}
}

/* ===== START SCREEN ===== */
#startScreen{
  z-index:10; display:flex; flex-direction:column; align-items:center; gap:16px;
  text-align:center; padding:20px;
}
#startScreen h1{
  font-size:2em; letter-spacing:4px;
  background: linear-gradient(90deg, #ff6b8a, #ffd93d, #6bcb77, #4dd0e1, #a855f7, #ff6b8a);
  background-size:300% 100%;
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  animation: shimmer 4s linear infinite;
}
@keyframes shimmer{0%{background-position:0% 50%}100%{background-position:300% 50%}}
#startScreen p{font-size:0.95em;color:#a898c8}
#startScreen .subtitle{font-size:0.8em;color:#8070a0;margin-top:-8px}
#nameInput{
  width:200px; padding:10px 16px; border-radius:12px;
  border:2px solid #6b3fa0; background:rgba(30,15,50,0.8);
  color:#e8d0ff; font-size:1em; text-align:center; outline:none;
}
#nameInput:focus{border-color:#a855f7;box-shadow:0 0 16px rgba(168,85,247,0.3)}
#startBtn{
  padding:12px 36px; border-radius:14px; border:2px solid #a855f7;
  background:linear-gradient(135deg,rgba(168,85,247,0.3),rgba(107,63,160,0.2));
  color:#e8d0ff; font-size:1.1em; cursor:pointer; letter-spacing:2px;
  transition:all 0.3s;
}
#startBtn:hover{background:linear-gradient(135deg,rgba(168,85,247,0.5),rgba(107,63,160,0.35));transform:scale(1.05)}

/* ===== PK BANNER ===== */
#pkBanner{
  display:none; z-index:10; padding:8px 16px; margin-bottom:4px;
  background:linear-gradient(90deg,rgba(255,107,138,0.15),rgba(168,85,247,0.15));
  border:1px solid rgba(255,107,138,0.3); border-radius:10px;
  font-size:0.8em; color:#ffb0c0; text-align:center;
}

/* ===== GAME SCREEN ===== */
#gameScreen{display:none;z-index:10;flex-direction:column;align-items:center;width:100%;height:100%}
#gameHeader{
  display:flex; justify-content:space-between; align-items:center;
  width:100%; max-width:460px; padding:6px 12px;
  font-size:0.8em; color:#c0b0d8;
}
#gameHeader .stat{display:flex;flex-direction:column;align-items:center;gap:1px}
#gameHeader .val{font-size:1.3em;font-weight:bold;color:#e8d0ff}
#gameTitle{font-size:0.85em;color:#a898c8;letter-spacing:2px}

/* ===== CARD GRID ===== */
#cardGrid{
  display:grid; grid-template-columns:repeat(8,1fr);
  gap:5px; padding:6px; max-width:460px; width:100%;
}
.card{
  aspect-ratio:1/1; perspective:600px; cursor:pointer;
  border-radius:6px;
}
.card-inner{
  width:100%;height:100%;position:relative;
  transform-style:preserve-3d; transition:transform 0.4s ease;
  border-radius:6px;
}
.card.flipped .card-inner{transform:rotateY(180deg)}

.card-face{
  position:absolute;width:100%;height:100%;backface-visibility:hidden;
  border-radius:6px; overflow:hidden;
}

/* ===== CARD BACK - Poker Style ===== */
.card-back{
  background: linear-gradient(145deg, #1a0a3e, #0d0528);
  border:2.5px solid #c9a84c;
  display:flex; align-items:center; justify-content:center;
  position:relative; overflow:hidden;
}
/* Outer frame lines */
.card-back::before{
  content:''; position:absolute; top:4px;left:4px;right:4px;bottom:4px;
  border:1.5px solid rgba(201,168,76,0.5); border-radius:3px; pointer-events:none;
}
/* Diamond pattern */
.card-back::after{
  content:''; position:absolute; top:0;left:0;width:100%;height:100%;
  background:
    repeating-linear-gradient(45deg, transparent, transparent 6px, rgba(196,167,255,0.04) 6px, rgba(196,167,255,0.04) 7px),
    repeating-linear-gradient(-45deg, transparent, transparent 6px, rgba(196,167,255,0.04) 6px, rgba(196,167,255,0.04) 7px);
  pointer-events:none;
}
/* Corner diamonds */
.card-corner{
  position:absolute; width:8px; height:8px;
  background:linear-gradient(45deg, #c9a84c, #e8c84c);
  transform:rotate(45deg);
}
.card-corner.tl{top:7px;left:7px} .card-corner.tr{top:7px;right:7px}
.card-corner.bl{bottom:7px;left:7px} .card-corner.br{bottom:7px;right:7px}

/* Holographic 大麦 text */
.card-text{
  position:relative; z-index:2;
  font-family:"KaiTi","STKaiti","SimSun",serif;
  font-size:1.0em; font-weight:bold; letter-spacing:2px;
  background:linear-gradient(90deg, #ff6b8a, #ffd93d, #6bcb77, #4dd0e1, #a855f7, #ff6b8a);
  background-size:300% 100%;
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  animation:shimmer 4s linear infinite;
  filter:drop-shadow(0 0 6px rgba(168,85,247,0.4));
}
.card-sub{
  position:relative; z-index:2;
  font-size:0.45em; color:rgba(201,168,76,0.6); letter-spacing:3px; margin-top:1px;
}
/* Sweep light effect */
.card-sweep{
  position:absolute; top:0;left:-100%;width:100%;height:100%;
  background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,0.06) 50%,transparent 60%);
  animation:sweep 5s ease-in-out infinite; pointer-events:none;
}
@keyframes sweep{0%,100%{left:-100%}50%{left:100%}}

/* ===== CARD FRONT (Portrait) ===== */
.card-front{
  transform:rotateY(180deg);
  background:#1a0a30; border:2px solid #c9a84c;
  display:flex; align-items:center; justify-content:center;
}
.card-front img{
  width:100%; height:100%; object-fit:cover;
  border-radius:3px;
}

/* ===== MATCHED EFFECT ===== */
.card.matched .card-front{
  border-color:#4dffc3;
  box-shadow:0 0 12px rgba(77,255,195,0.4), 0 0 24px rgba(77,255,195,0.15);
}
.card.matched .card-inner{
  animation:matchPulse 0.5s ease;
}
@keyframes matchPulse{
  0%{transform:rotateY(180deg) scale(1)}
  50%{transform:rotateY(180deg) scale(1.08)}
  100%{transform:rotateY(180deg) scale(1)}
}

/* ===== MISMATCH SHAKE ===== */
.card.mismatch .card-inner{
  animation:mismatchShake 0.4s ease;
}
@keyframes mismatchShake{
  0%,100%{transform:rotateY(180deg) translateX(0)}
  25%{transform:rotateY(180deg) translateX(-4px)}
  75%{transform:rotateY(180deg) translateX(4px)}
}

/* ===== MATCH PARTICLES ===== */
.match-particle{
  position:fixed; width:6px; height:6px; border-radius:50%;
  pointer-events:none; z-index:100;
  animation:particleBurst 0.6s ease-out forwards;
}
@keyframes particleBurst{
  0%{opacity:1;transform:translate(0,0) scale(1)}
  100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(0)}
}

/* ===== RESULT MODAL ===== */
#resultModal{
  display:none; position:fixed; top:0;left:0;width:100%;height:100%;
  background:rgba(5,0,15,0.85); z-index:50;
  flex-direction:column; align-items:center; justify-content:center;
  padding:16px; gap:10px;
}
#resultModal h2{font-size:1.5em;color:#ffd93d}
.result-stats{display:flex;gap:24px;font-size:1em;color:#c0b0d8}
.result-stats .val{font-size:1.8em;font-weight:bold;color:#e8d0ff}
.result-grade{
  font-size:1.2em; padding:4px 16px; border-radius:20px;
  border:2px solid #ffd93d; color:#ffd93d;
}

/* Leaderboard */
.leaderboard-container{
  display:flex; gap:8px; width:100%; max-width:420px; margin-top:6px;
}
.lb-col{
  flex:1; background:rgba(20,10,40,0.8); border-radius:10px;
  border:1px solid rgba(168,85,247,0.3); padding:8px; overflow:hidden;
}
.lb-col h3{
  font-size:0.8em; text-align:center; padding-bottom:4px;
  border-bottom:1px solid rgba(168,85,247,0.3); margin-bottom:4px;
}
.lb-col h3.steps{color:#ffd93d} .lb-col h3.time{color:#4dd0e1}
.lb-entry{
  display:flex; justify-content:space-between; align-items:center;
  font-size:0.65em; padding:2px 4px; color:#a898c8;
  border-bottom:1px solid rgba(100,80,140,0.15);
}
.lb-entry .rank{color:#c9a84c;font-weight:bold;width:16px} 
.lb-entry .name{flex:1;margin-left:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-entry .score{font-weight:bold;margin-left:4px}
.lb-entry .score.steps-score{color:#ffd93d} .lb-entry .score.time-score{color:#4dd0e1}
.lb-entry.current{background:rgba(168,85,247,0.2);border-radius:4px}

/* Result buttons */
.result-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.result-btns button{
  padding:8px 18px; border-radius:10px; font-size:0.85em;
  cursor:pointer; transition:all 0.3s; letter-spacing:1px;
}
.btn-retry{border-color:#c44dff;background:rgba(196,77,255,0.15);color:#e8d0ff}
.btn-share{border-color:#4dffc3;background:rgba(77,255,195,0.15);color:#c8ffe8}
.btn-home{border-color:#a89cc8;background:rgba(168,156,200,0.1);color:#d0c8e8}

/* Confetti */
.confetti{position:fixed;width:8px;height:8px;z-index:60;pointer-events:none;border-radius:2px}
@keyframes confettiFall{
  0%{transform:translateY(-10vh) rotate(0deg);opacity:1}
  100%{transform:translateY(110vh) rotate(720deg);opacity:0}
}

/* Toast */
.toast{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  background:rgba(30,15,50,0.95);border:1px solid #a855f7;
  border-radius:12px;padding:12px 24px;z-index:200;
  font-size:0.9em;color:#e8d0ff;
  animation:toastIn 0.3s ease, toastOut 0.3s ease 1.5s forwards;
}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-50%) scale(0.8)}}
@keyframes toastOut{to{opacity:0;transform:translate(-50%,-50%) scale(0.8)}}

/* Responsive */
@media(max-width:400px){
  #cardGrid{gap:3px;padding:3px}
  .card-text{font-size:0.75em} .card-sub{font-size:0.35em}
  .card-corner{width:5px;height:5px}
  #gameHeader{font-size:0.7em} #gameHeader .val{font-size:1.1em}
}
</style>
</head>
<body>

<!-- START SCREEN -->
<div id="startScreen">
  <h1>✦ 大麦记忆 ✦</h1>
  <p>5×8 挑战模式 · 20对肖像</p>
  <p class="subtitle">翻牌配对，考验记忆力！</p>
  <input id="nameInput" placeholder="输入昵称" maxlength="8">
  <button id="startBtn">开始挑战</button>
</div>

<!-- PK BANNER -->
<div id="pkBanner"></div>

<!-- GAME SCREEN -->
<div id="gameScreen">
  <div id="gameHeader">
    <div class="stat"><span class="val" id="stepsVal">0</span><span>步</span></div>
    <div id="gameTitle">✦ 大麦记忆 ✦</div>
    <div class="stat"><span class="val" id="timerVal">0:00</span><span>时间</span></div>
  </div>
  <div id="cardGrid"></div>
</div>

<!-- RESULT MODAL -->
<div id="resultModal">
  <h2>🎉 恭喜通关！</h2>
  <div class="result-stats">
    <div><div class="val" id="resSteps">0</div>步</div>
    <div><div class="val" id="resTime">0:00</div>时间</div>
  </div>
  <div class="result-grade" id="resGrade">S</div>
  <div class="leaderboard-container">
    <div class="lb-col"><h3 class="steps">🏆 步数榜 TOP10</h3><div id="lbSteps"></div></div>
    <div class="lb-col"><h3 class="time">⏱️ 时间榜 TOP10</h3><div id="lbTime"></div></div>
  </div>
  <div class="result-btns">
    <button class="btn-retry" onclick="restartGame()">🔄 再来一局</button>
    <button class="btn-share" onclick="shareResult()">📤 发到微信群PK</button>
    <button class="btn-home" onclick="goHome()">🏠 首页</button>
  </div>
</div>

const TOTAL_PAIRS=20;
const COLS=8;
const ROWS=5;

let cards=[];let flipped=[];let matched=0;let steps=0;let timer=null;let seconds=0;
let playerName='';let locked=false;let audioCtx=null;

// ===== AUDIO =====
function initAudio(){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
function playTone(freq,dur,type='sine',vol=0.15){
  if(!audioCtx)return;try{
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type=type;o.frequency.value=freq;g.gain.value=vol;
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
    o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}
function sfxFlip(){playTone(800,0.08,'sine',0.1)}
function sfxMatch(){playTone(523,0.12,'sine',0.15);setTimeout(()=>playTone(659,0.12,'sine',0.15),80);setTimeout(()=>playTone(784,0.2,'sine',0.12),160)}
function sfxMismatch(){playTone(200,0.15,'sawtooth',0.08)}
function sfxWin(){
  [523,659,784,1047].forEach((f,i)=>setTimeout(()=>playTone(f,0.3,'sine',0.12),i*150));
}

// ===== PARTICLES =====
function spawnParticles(card){
  const r=card.getBoundingClientRect();
  const cx=r.left+r.width/2, cy=r.top+r.height/2;
  const colors=['#ff6b8a','#ffd93d','#6bcb77','#4dd0e1','#a855f7'];
  for(let i=0;i<12;i++){
    const p=document.createElement('div');p.className='match-particle';
    p.style.left=cx+'px';p.style.top=cy+'px';
    p.style.background=colors[i%colors.length];
    const angle=Math.random()*Math.PI*2, dist=30+Math.random()*40;
    p.style.setProperty('--dx',Math.cos(angle)*dist+'px');
    p.style.setProperty('--dy',Math.sin(angle)*dist+'px');
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),700);
  }
}

// ===== CONFETTI =====
function spawnConfetti(){
  const colors=['#ff6b8a','#ffd93d','#6bcb77','#4dd0e1','#a855f7','#ff9ff3'];
  for(let i=0;i<60;i++){
    const c=document.createElement('div');c.className='confetti';
    c.style.left=Math.random()*100+'vw';
    c.style.background=colors[i%colors.length];
    c.style.width=(4+Math.random()*8)+'px';
    c.style.height=(4+Math.random()*8)+'px';
    c.style.borderRadius=Math.random()>0.5?'50%':'2px';
    c.style.animation=`confettiFall ${1.5+Math.random()*2}s ease-in ${Math.random()*0.5}s forwards`;
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),4000);
  }
}

// ===== GAME LOGIC =====
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}

function startGame(){
  playerName=document.getElementById('nameInput').value.trim()||'玩家';
  if(!audioCtx)initAudio();
  document.getElementById('startScreen').style.display='none';
  document.getElementById('gameScreen').style.display='flex';
  checkPK();
  resetGame();
}

function resetGame(){
  matched=0;steps=0;seconds=0;flipped=[];locked=false;
  document.getElementById('stepsVal').textContent='0';
  document.getElementById('timerVal').textContent='0:00';
  clearInterval(timer);timer=null;
  
  // Create pairs
  let deck=[];
  for(let i=0;i<TOTAL_PAIRS;i++)deck.push(i,i);
  shuffle(deck);
  cards=deck;
  
  const grid=document.getElementById('cardGrid');
  grid.innerHTML='';
  deck.forEach((id,idx)=>{
    const card=document.createElement('div');
    card.className='card';card.dataset.id=id;card.dataset.idx=idx;
    card.innerHTML=`
      <div class="card-inner">
        <div class="card-face card-back">
          <span class="card-corner tl"></span><span class="card-corner tr"></span>
          <span class="card-corner bl"></span><span class="card-corner br"></span>
          <span class="card-text">大麦</span>
          <span class="card-sub">MEMORY</span>
          <div class="card-sweep"></div>
        </div>
        <div class="card-face card-front">
          <img src="${AVATARS[id]}" alt="portrait">
        </div>
      </div>`;
    card.addEventListener('click',()=>flipCard(card));
    grid.appendChild(card);
  });
}

function flipCard(card){
  if(locked)return;
  if(card.classList.contains('flipped')||card.classList.contains('matched'))return;
  if(flipped.length>=2)return;
  
  sfxFlip();
  card.classList.add('flipped');
  flipped.push(card);
  
  if(flipped.length===2){
    steps++;
    document.getElementById('stepsVal').textContent=steps;
    if(!timer)startTimer();
    
    const id0=flipped[0].dataset.id, id1=flipped[1].dataset.id;
    if(id0===id1){
      // Match!
      locked=true;
      setTimeout(()=>{
        flipped.forEach(c=>{
          c.classList.add('matched');
          spawnParticles(c);
        });
        sfxMatch();
        matched++;
        flipped=[];locked=false;
        if(matched===TOTAL_PAIRS)gameWon();
      },300);
    }else{
      // Mismatch
      locked=true;
      setTimeout(()=>{
        sfxMismatch();
        flipped.forEach(c=>c.classList.add('mismatch'));
        setTimeout(()=>{
          flipped.forEach(c=>{c.classList.remove('flipped','mismatch')});
          flipped=[];locked=false;
        },500);
      },600);
    }
  }
}

function startTimer(){
  timer=setInterval(()=>{
    seconds++;
    const m=Math.floor(seconds/60),s=seconds%60;
    document.getElementById('timerVal').textContent=m+':'+(s<10?'0':'')+s;
  },1000);
}

function gameWon(){
  clearInterval(timer);
  sfxWin();
  spawnConfetti();
  
  // Show result
  const m=Math.floor(seconds/60),s=seconds%60;
  const timeStr=m+':'+(s<10?'0':'')+s;
  document.getElementById('resSteps').textContent=steps;
  document.getElementById('resTime').textContent=timeStr;
  
  // Grade
  let grade='C',gradeLabel='继续加油';
  if(steps<=24){grade='S';gradeLabel='超神记忆'}
  else if(steps<=34){grade='A';gradeLabel='记忆高手'}
  else if(steps<=50){grade='B';gradeLabel='记忆不错'}
  document.getElementById('resGrade').textContent=grade+' · '+gradeLabel;
  
  // Save to leaderboard
  saveScore(playerName,steps,seconds);
  renderLeaderboard();
  
  setTimeout(()=>{
    document.getElementById('resultModal').style.display='flex';
  },800);
}

// ===== LEADERBOARD =====
function saveScore(name,steps,time){
  let lb=JSON.parse(localStorage.getItem('dm_lb')||'{"steps":[],"time":[]}');
  lb.steps.push({name,steps,time});
  lb.time.push({name,steps,time});
  lb.steps.sort((a,b)=>a.steps-b.steps||a.time-b.time);
  lb.time.sort((a,b)=>a.time-b.time||a.steps-b.steps);
  lb.steps=lb.steps.slice(0,10);
  lb.time=lb.time.slice(0,10);
  localStorage.setItem('dm_lb',JSON.stringify(lb));
  return lb;
}

function renderLeaderboard(){
  const lb=JSON.parse(localStorage.getItem('dm_lb')||'{"steps":[],"time":[]}');
  
  // Steps leaderboard
  const stepsHtml=lb.steps.map((e,i)=>{
    const cur=e.name===playerName&&e.steps===steps&&e.time===seconds?'current':'';
    return `<div class="lb-entry ${cur}"><span class="rank">${i+1}</span><span class="name">${e.name}</span><span class="score steps-score">${e.steps}步</span></div>`;
  }).join('');
  document.getElementById('lbSteps').innerHTML=stepsHtml||'<div style="font-size:0.7em;color:#6050a0;text-align:center;padding:8px">暂无记录</div>';
  
  // Time leaderboard  
  const timeHtml=lb.time.map((e,i)=>{
    const cur=e.name===playerName&&e.steps===steps&&e.time===seconds?'current':'';
    const m=Math.floor(e.time/60),s=e.time%60;
    return `<div class="lb-entry ${cur}"><span class="rank">${i+1}</span><span class="name">${e.name}</span><span class="score time-score">${m}:${(s<10?'0':'')+s}</span></div>`;
  }).join('');
  document.getElementById('lbTime').innerHTML=timeHtml||'<div style="font-size:0.7em;color:#6050a0;text-align:center;padding:8px">暂无记录</div>';
}

// ===== PK =====
function checkPK(){
  const p=new URLSearchParams(location.search);
  if(p.get('pk_name')){
    const banner=document.getElementById('pkBanner');
    const pkSteps=p.get('pk_steps')||'?';
    const pkTime=p.get('pk_time')||'?';
    const m=Math.floor(pkTime/60),s=pkTime%60;
    banner.innerHTML=`⚡ PK挑战：${p.get('pk_name')} 用 ${pkSteps}步 / ${m}:${(s<10?'0':'')+s} 完成，你能超越吗？`;
    banner.style.display='block';
  }
}

function shareResult(){
  const url=location.origin+location.pathname+'?pk_name='+encodeURIComponent(playerName)+'&pk_steps='+steps+'&pk_time='+seconds;
  const text=`🃏 大麦记忆PK！我用了${steps}步完成了5×8翻牌挑战，来超越我！\n${url}`;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>showToast('📋 PK链接已复制！发给好友吧'));
  }else{
    const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();
    showToast('📋 PK链接已复制！发给好友吧');
  }
}

function showToast(msg){
  const t=document.createElement('div');t.className='toast';t.textContent=msg;
  document.body.appendChild(t);setTimeout(()=>t.remove(),2000);
}

function restartGame(){
  document.getElementById('resultModal').style.display='none';
  resetGame();
}

function goHome(){
  document.getElementById('resultModal').style.display='none';
  document.getElementById('gameScreen').style.display='none';
  document.getElementById('startScreen').style.display='flex';
  clearInterval(timer);
}

// Start button
document.getElementById('startBtn').addEventListener('click',startGame);
document.getElementById('nameInput').addEventListener('keydown',e=>{if(e.key==='Enter')startGame()});
</script>
