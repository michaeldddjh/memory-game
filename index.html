<style>
* { margin:0; padding:0; box-sizing:border-box; }

@keyframes float {
  0%,100% { transform: translateY(0px); }
  50% { transform: translateY(-6px); }
}

@keyframes pulse-glow {
  0%,100% { box-shadow: 0 0 8px #4ade80, 0 0 16px rgba(74,222,128,0.3); }
  50% { box-shadow: 0 0 16px #4ade80, 0 0 32px rgba(74,222,128,0.5); }
}

@keyframes card-deal {
  0% { transform: scale(0) rotate(180deg); opacity:0; }
  60% { transform: scale(1.1) rotate(-10deg); opacity:1; }
  100% { transform: scale(1) rotate(0deg); opacity:1; }
}

@keyframes shake {
  0%,100% { transform: translateX(0); }
  25% { transform: translateX(-4px); }
  75% { transform: translateX(4px); }
}

@keyframes score-pop {
  0% { transform: scale(1); }
  50% { transform: scale(1.3); }
  100% { transform: scale(1); }
}

@keyframes confetti-fall {
  0% { transform: translateY(-100vh) rotate(0deg); opacity:1; }
  100% { transform: translateY(100vh) rotate(720deg); opacity:0; }
}

  font-size: 22px; font-weight: 800;
  background: linear-gradient(135deg, #fbbf24, #f59e0b, #fbbf24);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  text-shadow: none;
  letter-spacing: 2px;
}

.game-subtitle {
  font-size: 11px; color: rgba(255,255,255,0.5);
  margin-top: 2px; letter-spacing: 1px;
}

/* Stats Bar */
.stats-bar {
  display: flex; justify-content: space-around; align-items: center;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(10px);
  border-radius: 16px; padding: 8px 12px;
  margin: 6px 0;
  border: 1px solid rgba(255,255,255,0.1);
}

.stat-item {
  text-align: center;
}

.stat-label {
  font-size: 10px; color: rgba(255,255,255,0.5);
  text-transform: uppercase; letter-spacing: 1px;
}

.stat-value {
  font-size: 20px; font-weight: 800;
  color: #fbbf24;
}

.stat-value.time { color: #60a5fa; }
.stat-value.pairs { color: #4ade80; }

/* Progress bar */
.progress-bar {
  height: 3px; background: rgba(255,255,255,0.1);
  border-radius: 2px; margin: 4px 0 6px;
  overflow: hidden;
}

.progress-fill {
  height: 100%; background: linear-gradient(90deg, #fbbf24, #4ade80);
  border-radius: 2px; transition: width 0.5s ease;
  width: 0%;
}

/* PK Banner */
.pk-banner {
  display: none;
  background: linear-gradient(135deg, #7c3aed, #ec4899);
  border-radius: 12px; padding: 8px 12px;
  margin: 4px 0; text-align: center;
  font-size: 12px; animation: float 3s ease-in-out infinite;
}

.pk-banner.show { display: block; }

.pk-name { font-weight: 700; color: #fbbf24; }

/* Game Grid - 5 columns x 8 rows */
.game-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 5px;
  padding: 4px;
  margin: 4px 0;
}

.card {
  aspect-ratio: 1;
  perspective: 600px;
  cursor: pointer;
  animation: card-deal 0.4s ease-out backwards;
}

.card:nth-child(1) { animation-delay: 0.02s; }
.card:nth-child(2) { animation-delay: 0.04s; }
.card:nth-child(3) { animation-delay: 0.06s; }
.card:nth-child(4) { animation-delay: 0.08s; }
.card:nth-child(5) { animation-delay: 0.10s; }
.card:nth-child(6) { animation-delay: 0.12s; }
.card:nth-child(7) { animation-delay: 0.14s; }
.card:nth-child(8) { animation-delay: 0.16s; }
.card:nth-child(9) { animation-delay: 0.18s; }
.card:nth-child(10) { animation-delay: 0.20s; }
.card:nth-child(n+11):nth-child(-n+20) { animation-delay: 0.25s; }
.card:nth-child(n+21):nth-child(-n+30) { animation-delay: 0.35s; }
.card:nth-child(n+31) { animation-delay: 0.45s; }

.card-inner {
  width: 100%; height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  border-radius: 10px;
}

.card.flipped .card-inner { transform: rotateY(180deg); }

.card-front, .card-back {
  position: absolute; width: 100%; height: 100%;
  backface-visibility: hidden;
  border-radius: 10px;
  overflow: hidden;
}

  border-color: #4ade80;
  animation: pulse-glow 2s ease-in-out infinite;
}

.card.matched {
  pointer-events: none;
}

.card.wrong {
  animation: shake 0.4s ease;
}

.card.wrong .card-front {
  border-color: #f87171;
}

/* Bottom Controls */
.controls {
  display: flex; gap: 8px; margin: 6px 0;
  justify-content: center;
}

.btn {
  padding: 8px 16px;
  border: none; border-radius: 20px;
  font-size: 13px; font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: 0.5px;
}

.btn-restart {
  background: linear-gradient(135deg, #fbbf24, #f59e0b);
  color: #0a0a1a;
}

.btn-music {
  background: rgba(255,255,255,0.1);
  color: white;
  border: 1px solid rgba(255,255,255,0.2);
  font-size: 16px;
  width: 36px; height: 36px;
  padding: 0; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
}

.btn-share {
  background: linear-gradient(135deg, #7c3aed, #ec4899);
  color: white;
  flex: 1;
}

.btn:active { transform: scale(0.95); }

/* Result Modal */
.modal-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(8px);
  z-index: 100;
  align-items: center; justify-content: center;
}

.modal-overlay.show { display: flex; }

.modal {
  background: linear-gradient(145deg, #1e1b4b, #312e81);
  border-radius: 24px;
  padding: 28px 24px;
  max-width: 340px; width: 90%;
  text-align: center;
  border: 1px solid rgba(251,191,36,0.3);
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}

.modal-grade {
  font-size: 64px; font-weight: 900;
  margin: 8px 0;
}

.modal-grade.S { color: #fbbf24; text-shadow: 0 0 30px rgba(251,191,36,0.5); }
.modal-grade.A { color: #60a5fa; text-shadow: 0 0 30px rgba(96,165,250,0.5); }
.modal-grade.B { color: #4ade80; text-shadow: 0 0 30px rgba(74,222,128,0.5); }
.modal-grade.C { color: #f87171; }

.modal-title {
  font-size: 18px; font-weight: 700;
  margin-bottom: 12px;
}

.modal-stats {
  display: flex; justify-content: center; gap: 24px;
  margin: 16px 0;
}

.modal-stat { text-align: center; }
.modal-stat-val { font-size: 28px; font-weight: 800; color: #fbbf24; }
.modal-stat-label { font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 2px; }

.modal-comment {
  font-size: 14px; color: rgba(255,255,255,0.7);
  margin: 12px 0 20px;
  line-height: 1.6;
}

.modal-btns {
  display: flex; gap: 10px;
}

.modal-btns .btn { flex:1; padding: 10px; }

/* Confetti */
.confetti {
  position: fixed; top: 0;
  width: 10px; height: 10px;
  border-radius: 2px;
  z-index: 101;
  pointer-events: none;
  animation: confetti-fall 3s ease-in forwards;
}

/* PK Result Banner */
.pk-result {
  display: none;
  background: rgba(0,0,0,0.8);
  backdrop-filter: blur(10px);
  border-radius: 16px; padding: 12px;
  margin: 6px 0;
  text-align: center;
  border: 1px solid rgba(251,191,36,0.3);
}

.pk-result.show { display: block; }

.pk-vs {
  display: flex; justify-content: space-around; align-items: center;
  margin: 8px 0;
}

.pk-player {
  text-align: center;
}

.pk-player-name {
  font-size: 13px; font-weight: 700; color: #fbbf24;
}

.pk-player-score {
  font-size: 11px; color: rgba(255,255,255,0.6);
}

.pk-winner {
  font-size: 18px; font-weight: 800;
  margin-top: 8px;
}

.pk-winner.win { color: #4ade80; }
.pk-winner.lose { color: #f87171; }
.pk-winner.tie { color: #fbbf24; }

/* Name input */
.name-input-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.8);
  backdrop-filter: blur(8px);
  z-index: 100;
  align-items: center; justify-content: center;
}

.name-input-overlay.show { display: flex; }

.name-box {
  background: linear-gradient(145deg, #1e1b4b, #312e81);
  border-radius: 24px;
  padding: 24px;
  max-width: 320px; width: 90%;
  text-align: center;
  border: 1px solid rgba(251,191,36,0.3);
}

.name-box h3 {
  font-size: 18px; color: #fbbf24; margin-bottom: 16px;
}

.name-box input {
  width: 100%; padding: 10px 16px;
  border: 2px solid rgba(251,191,36,0.4);
  border-radius: 12px;
  background: rgba(255,255,255,0.05);
  color: white; font-size: 16px;
  text-align: center;
  outline: none;
}

.name-box input:focus {
  border-color: #fbbf24;
}

.name-box .btn {
  margin-top: 16px;
  width: 100%;
  padding: 12px;
}
</style>
</head>
<body>

<div class="bg-layer"></div>
<div class="bg-overlay"></div>

<div class="container">
  <div class="header">
    <div class="game-title">🃏 麦白翻牌</div>
    <div class="game-subtitle">MEMORY CHALLENGE</div>
  </div>

  <div class="pk-banner" id="pkBanner">
    ⚔️ <span class="pk-name" id="pkChallenger"></span> 邀请你来PK！
    <span id="pkChallengerScore"></span>
  </div>

  <div class="stats-bar">
    <div class="stat-item">
      <div class="stat-label">步数</div>
      <div class="stat-value" id="moves">0</div>
    </div>
    <div class="stat-item">
      <div class="stat-label">时间</div>
      <div class="stat-value time" id="timer">0:00</div>
    </div>
    <div class="stat-item">
      <div class="stat-label">配对</div>
      <div class="stat-value pairs" id="pairs">0/20</div>
    </div>
  </div>

  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

  <div class="game-grid" id="gameGrid"></div>

  <div class="controls">
    <button class="btn btn-music" id="musicBtn" onclick="toggleMusic()">🎵</button>
    <button class="btn btn-restart" onclick="restartGame()">🔄 重来</button>
    <button class="btn btn-share" onclick="shareToWeChat()">📤 发起PK</button>
  </div>
</div>

<!-- Result Modal -->
<div class="modal-overlay" id="resultModal">
  <div class="modal">
    <div class="modal-grade" id="gradeText"></div>
    <div class="modal-title" id="resultTitle"></div>
    <div class="modal-stats">
      <div class="modal-stat">
        <div class="modal-stat-val" id="finalMoves">0</div>
        <div class="modal-stat-label">步数</div>
      </div>
      <div class="modal-stat">
        <div class="modal-stat-val" id="finalTime">0:00</div>
        <div class="modal-stat-label">用时</div>
      </div>
    </div>
    <div class="modal-comment" id="resultComment"></div>
    <div class="modal-btns">
      <button class="btn btn-restart" onclick="restartGame()">🔄 再来</button>
      <button class="btn btn-share" onclick="shareToWeChat()">📤 PK</button>
    </div>
  </div>
</div>

<!-- Name Input -->
<div class="name-input-overlay" id="nameOverlay">
  <div class="name-box">
    <h3>✏️ 输入你的名字</h3>
    <input type="text" id="playerName" placeholder="你的名字" maxlength="10" autocomplete="off">
    <button class="btn btn-restart" onclick="startGame()">🎮 开始挑战</button>
  </div>
</div>

      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      osc.start();
      osc.frequency.setValueAtTime(659, audioCtx.currentTime + 0.1);
      osc.frequency.setValueAtTime(784, audioCtx.currentTime + 0.2);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
      osc.stop(audioCtx.currentTime + 0.4);
    } else if (type === 'wrong') {
      osc.frequency.value = 200;
      osc.type = 'sawtooth';
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
      osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    } else if (type === 'win') {
      [523,659,784,1047].forEach((freq, i) => {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination);
        o.frequency.value = freq;
        o.type = 'sine';
        g.gain.setValueAtTime(0.12, audioCtx.currentTime + i*0.15);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i*0.15 + 0.3);
        o.start(audioCtx.currentTime + i*0.15);
        o.stop(audioCtx.currentTime + i*0.15 + 0.3);
      });
    }
  } catch(e) {}
}

function toggleMusic() {
  const btn = document.getElementById('musicBtn');
  if (!bgmAudio) {
    bgmAudio = new Audio(BGM_URL);
    bgmAudio.loop = true;
    bgmAudio.volume = 0.3;
  }
  if (musicPlaying) {
    bgmAudio.pause();
    btn.textContent = '🎵';
    musicPlaying = false;
  } else {
    bgmAudio.play().catch(()=>{});
    btn.textContent = '🔊';
    musicPlaying = true;
  }
}

// Initialize
function init() {
  // Check URL for PK challenge
  const params = new URLSearchParams(window.location.search);
  const challenger = params.get('challenger');
  const challengerMoves = params.get('moves');
  const challengerTime = params.get('time');
  
  if (challenger) {
    pkData = { name: challenger, moves: parseInt(challengerMoves), time: parseInt(challengerTime) };
    document.getElementById('pkBanner').classList.add('show');
    document.getElementById('pkChallenger').textContent = challenger;
    document.getElementById('pkChallengerScore').textContent = 
      `（${challengerMoves}步 / ${formatTime(pkData.time)}）`;
  }
  
  // Show name input
  document.getElementById('nameOverlay').classList.add('show');
  document.getElementById('playerName').focus();
}

function startGame() {
  playerName = document.getElementById('playerName').value.trim() || '玩家';
  document.getElementById('nameOverlay').classList.remove('show');
  createGame();
}

function createGame() {
  const grid = document.getElementById('gameGrid');
  grid.innerHTML = '';
  
  // Create pairs
  cards = [];
  for (let i = 0; i < TOTAL_PAIRS; i++) {
    cards.push({ id: i, portrait: i });
    cards.push({ id: i + TOTAL_PAIRS, portrait: i });
  }
  
  // Shuffle
  for (let i = cards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cards[i], cards[j]] = [cards[j], cards[i]];
  }
  
  // Build grid
  cards.forEach((card, idx) => {
    const cardEl = document.createElement('div');
    cardEl.className = 'card';
    cardEl.dataset.index = idx;
    cardEl.dataset.portrait = card.portrait;
    cardEl.innerHTML = `
      <div class="card-inner">
        <div class="card-back"></div>
        <div class="card-front">
          <img src="${PORTRAITS[card.portrait]}" alt="portrait">
        </div>
      </div>
    `;
    cardEl.addEventListener('click', () => flipCard(idx));
    grid.appendChild(cardEl);
  });
  
  // Reset state
  flippedCards = [];
  matchedPairs = 0;
  moves = 0;
  seconds = 0;
  gameStarted = false;
  isProcessing = false;
  clearInterval(timerInterval);
  
  updateUI();
}

function flipCard(idx) {
  if (isProcessing) return;
  const cardEl = document.querySelectorAll('.card')[idx];
  if (!cardEl || cardEl.classList.contains('flipped') || cardEl.classList.contains('matched')) return;
  
  // Resume audio context on first interaction
  if (audioCtx.state === 'suspended') audioCtx.resume();
  
  // Start timer on first flip
  if (!gameStarted) {
    gameStarted = true;
    timerInterval = setInterval(() => {
      seconds++;
      document.getElementById('timer').textContent = formatTime(seconds);
    }, 1000);
  }
  
  cardEl.classList.add('flipped');
  playSound('flip');
  flippedCards.push(idx);
  
  if (flippedCards.length === 2) {
    moves++;
    isProcessing = true;
    
    const card1 = cards[flippedCards[0]];
    const card2 = cards[flippedCards[1]];
    
    if (card1.portrait === card2.portrait) {
      // Match!
      setTimeout(() => {
        const el1 = document.querySelectorAll('.card')[flippedCards[0]];
        const el2 = document.querySelectorAll('.card')[flippedCards[1]];
        el1.classList.add('matched');
        el2.classList.add('matched');
        playSound('match');
        matchedPairs++;
        flippedCards = [];
        isProcessing = false;
        updateUI();
        
        if (matchedPairs === TOTAL_PAIRS) {
          gameComplete();
        }
      }, 300);
    } else {
      // No match
      setTimeout(() => {
        const el1 = document.querySelectorAll('.card')[flippedCards[0]];
        const el2 = document.querySelectorAll('.card')[flippedCards[1]];
        el1.classList.add('wrong');
        el2.classList.add('wrong');
        playSound('wrong');
        
        setTimeout(() => {
          el1.classList.remove('flipped', 'wrong');
          el2.classList.remove('flipped', 'wrong');
          flippedCards = [];
          isProcessing = false;
        }, 600);
      }, 500);
    }
    
    updateUI();
  }
}

function updateUI() {
  document.getElementById('moves').textContent = moves;
  document.getElementById('pairs').textContent = `${matchedPairs}/${TOTAL_PAIRS}`;
  document.getElementById('progressFill').style.width = `${(matchedPairs/TOTAL_PAIRS)*100}%`;
  
  // Animate moves
  const movesEl = document.getElementById('moves');
  movesEl.style.animation = 'none';
  movesEl.offsetHeight;
  movesEl.style.animation = 'score-pop 0.3s ease';
}

function formatTime(s) {
  const min = Math.floor(s / 60);
  const sec = s % 60;
  return `${min}:${sec.toString().padStart(2, '0')}`;
}

function getGrade(moves) {
  if (moves <= 28) return { grade: 'S', title: '超神记忆！🏆', comment: '你的大脑是照相机吗？太强了！' };
  if (moves <= 38) return { grade: 'A', title: '记忆达人！🌟', comment: '出色的表现！你的记忆力令人佩服！' };
  if (moves <= 50) return { grade: 'B', title: '不错的成绩！👍', comment: '继续练习，你还能更快！' };
  return { grade: 'C', title: '继续加油！💪', comment: '多玩几次，记忆力会越来越强！' };
}

function gameComplete() {
  clearInterval(timerInterval);
  playSound('win');
  
  const result = getGrade(moves);
  document.getElementById('gradeText').textContent = result.grade;
  document.getElementById('gradeText').className = 'modal-grade ' + result.grade;
  document.getElementById('resultTitle').textContent = result.title;
  document.getElementById('finalMoves').textContent = moves;
  document.getElementById('finalTime').textContent = formatTime(seconds);
  document.getElementById('resultComment').textContent = result.comment;
  
  // PK comparison
  if (pkData) {
    let pkText = '';
    const myScore = moves; // lower is better
    const challengerScore = pkData.moves;
    if (myScore < challengerScore) {
      pkText = `🎉 你击败了 ${pkData.name}！（${myScore}步 vs ${challengerScore}步）`;
    } else if (myScore > challengerScore) {
      pkText = `${pkData.name} 赢了！（${challengerScore}步 vs ${myScore}步）再来一次？`;
    } else {
      pkText = `🤝 平局！你和${pkData.name}都是${myScore}步！`;
    }
    document.getElementById('resultComment').textContent = result.comment + '\n\n' + pkText;
  }
  
  // Show confetti
  setTimeout(() => {
    document.getElementById('resultModal').classList.add('show');
    spawnConfetti();
  }, 500);
}

function spawnConfetti() {
  const colors = ['#fbbf24','#4ade80','#60a5fa','#f87171','#a78bfa','#ec4899'];
  for (let i = 0; i < 40; i++) {
    const el = document.createElement('div');
    el.className = 'confetti';
    el.style.left = Math.random() * 100 + 'vw';
    el.style.background = colors[Math.floor(Math.random()*colors.length)];
    el.style.animationDelay = Math.random() * 2 + 's';
    el.style.animationDuration = (2 + Math.random()*2) + 's';
    el.style.width = (6 + Math.random()*8) + 'px';
    el.style.height = (6 + Math.random()*8) + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 5000);
  }
}

function shareToWeChat() {
  const url = new URL(window.location.href);
  url.searchParams.set('challenger', playerName);
  url.searchParams.set('moves', moves);
  url.searchParams.set('time', seconds);
  const shareUrl = url.toString();
  
  // Copy to clipboard
  const shareText = `🃏 麦白翻牌记忆挑战！\n我用${moves}步完成了20对配对！\n你能超过我吗？\n\n${shareUrl}`;
  
  if (navigator.clipboard) {
    navigator.clipboard.writeText(shareText).then(() => {
      showToast('✅ 已复制！粘贴到微信群发起PK');
    }).catch(() => {
      fallbackCopy(shareText);
    });
  } else {
    fallbackCopy(shareText);
  }
}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  ta.remove();
  showToast('✅ 已复制！粘贴到微信群发起PK');
}

function showToast(msg) {
  const toast = document.createElement('div');
  toast.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.85);color:#fbbf24;padding:16px 24px;border-radius:16px;z-index:200;font-size:14px;text-align:center;backdrop-filter:blur(10px);';
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 2500);
}

function restartGame() {
  document.getElementById('resultModal').classList.remove('show');
  // Clear PK params from URL
  if (!pkData) {
    const url = new URL(window.location.href);
    url.searchParams.delete('challenger');
    url.searchParams.delete('moves');
    url.searchParams.delete('time');
    window.history.replaceState({}, '', url.toString());
  }
  createGame();
}

// Start
init();
</script>
