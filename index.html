<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>大麦记忆翻牌</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: linear-gradient(135deg, #0c0c1d 0%, #1a0a2e 30%, #16213e 60%, #0f3460 100%);
  min-height: 100vh; overflow-x: hidden; color: #e0e0ff;
}
.stars { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; }
.star { position:absolute; background:#fff; border-radius:50%; animation:twinkle var(--dur) ease-in-out infinite; }
@keyframes twinkle { 0%,100%{opacity:0.2;} 50%{opacity:1;} }
.container { position:relative; z-index:1; max-width:420px; margin:0 auto; padding:12px 8px; }
h1 { text-align:center; font-size:1.5em; margin:8px 0;
  background:linear-gradient(90deg,#f6d365,#fda085,#f6d365);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
.stats { display:flex; justify-content:center; gap:24px; margin:8px 0; font-size:0.95em; }
.stats span { background:rgba(255,255,255,0.08); padding:4px 14px; border-radius:20px; border:1px solid rgba(255,255,255,0.1); }
.board { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin:12px auto; padding:8px;
  background:rgba(255,255,255,0.03); border-radius:16px; border:1px solid rgba(255,255,255,0.06); }
.card { aspect-ratio:1/1; border-radius:10px; cursor:pointer; perspective:600px; -webkit-tap-highlight-color:transparent; }
.card-inner { position:relative; width:100%; height:100%; transition:transform 0.5s cubic-bezier(0.4,0,0.2,1); transform-style:preserve-3d; }
.card.flipped .card-inner, .card.matched .card-inner { transform:rotateY(180deg); }
.card-face { position:absolute; width:100%; height:100%; backface-visibility:hidden; border-radius:10px; overflow:hidden; }
.card-back {
  background:linear-gradient(135deg,#1a1a3e 0%,#2d1b69 50%,#1a1a3e 100%);
  border:2px solid; border-image:linear-gradient(135deg,#f6d365,#fda085,#a18cd1,#fbc2eb,#f6d365) 1;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  position:relative; overflow:hidden; }
.card-back::before { content:''; position:absolute; inset:-50%;
  background:conic-gradient(from 0deg,transparent,#f6d36522,transparent,#fda08522,transparent,#a18cd122,transparent,#fbc2eb22,transparent);
  animation:holoSpin 4s linear infinite; }
@keyframes holoSpin { to{transform:rotate(360deg);} }
.card-back-text { position:relative; z-index:2; font-size:1.1em; font-weight:900;
  background:linear-gradient(90deg,#f6d365,#fda085,#a18cd1,#fbc2eb,#f6d365);
  background-size:200% 100%; -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  background-clip:text; animation:holoText 3s linear infinite; letter-spacing:2px; }
@keyframes holoText { 0%{background-position:0% 50%;} 100%{background-position:200% 50%;} }
.card-back-sub { position:relative; z-index:2; font-size:0.45em; color:rgba(255,255,255,0.3); letter-spacing:4px; margin-top:2px; }
.card-front { transform:rotateY(180deg); background:#111; border:2px solid #333; }
.card-front img { width:100%; height:100%; object-fit:cover; }
.card.matched .card-front { border-color:#4ade80; box-shadow:0 0 12px rgba(74,222,128,0.4); animation:matchPulse 0.6s ease; }
@keyframes matchPulse { 0%{transform:rotateY(180deg) scale(1);} 50%{transform:rotateY(180deg) scale(1.08);} 100%{transform:rotateY(180deg) scale(1);} }
.card.matched { pointer-events:none; }
.btn-row { display:flex; justify-content:center; gap:12px; margin:12px 0; }
.btn { padding:8px 20px; border:none; border-radius:20px; font-size:0.9em; cursor:pointer; font-weight:600; transition:all 0.2s; }
.btn-primary { background:linear-gradient(135deg,#f6d365,#fda085); color:#1a1a3e; }
.btn-primary:hover { transform:scale(1.05); }
.btn-secondary { background:rgba(255,255,255,0.1); color:#e0e0ff; border:1px solid rgba(255,255,255,0.2); }
.btn-secondary:hover { background:rgba(255,255,255,0.2); }
.overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:100; align-items:center; justify-content:center; }
.overlay.show { display:flex; }
.result-box { background:linear-gradient(135deg,#1a1a3e,#2d1b69);
  border:2px solid; border-image:linear-gradient(135deg,#f6d365,#fda085) 1;
  border-radius:20px; padding:30px; text-align:center; max-width:340px;
  animation:popIn 0.4s cubic-bezier(0.175,0.885,0.32,1.275); }
@keyframes popIn { from{transform:scale(0.5);opacity:0;} }
.result-box h2 { font-size:1.8em; margin-bottom:12px; background:linear-gradient(90deg,#f6d365,#fda085); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.result-box .grade { font-size:3em; font-weight:900; margin:8px 0; }
.grade-s{color:#f6d365;} .grade-a{color:#4ade80;} .grade-b{color:#60a5fa;} .grade-c{color:#a78bfa;}
.result-box p { margin:4px 0; color:#b0b0cc; }
.result-box .btn { margin-top:16px; }
.pk-banner { display:none; background:linear-gradient(135deg,#dc2626,#f97316); padding:10px; border-radius:12px; margin:8px 0; text-align:center; animation:pkPulse 2s ease infinite; }
.pk-banner.show { display:block; }
@keyframes pkPulse { 0%,100%{box-shadow:0 0 10px rgba(220,38,38,0.3);} 50%{box-shadow:0 0 20px rgba(220,38,38,0.6);} }
.pk-banner h3 { font-size:1.1em; margin-bottom:4px; }
.pk-result { display:flex; justify-content:center; gap:20px; font-size:0.85em; margin-top:4px; }
.pk-challenger{color:#fef3c7;} .pk-you{color:#dbeafe;}
.confetti-container { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:99; overflow:hidden; }
.confetti { position:absolute; top:-10px; width:10px; height:10px; animation:confettiFall var(--fall-dur) linear forwards; }
@keyframes confettiFall { to{top:110vh;transform:rotate(720deg);} }
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="confetti-container" id="confetti"></div>
<div class="container">
  <h1>&#x1F0CF; 大麦记忆翻牌</h1>
  <div class="pk-banner" id="pkBanner">
    <h3>&#x2694;&#xFE0F; PK挑战!</h3>
    <p id="pkName"></p>
    <div class="pk-result" id="pkResult"></div>
  </div>
  <div class="stats">
    <span>&#x1F463; <b id="moves">0</b> 步</span>
    <span>&#x23F1;&#xFE0F; <b id="timer">0:00</b></span>
    <span>&#x1F3AF; <b id="pairs">0</b>/10</span>
  </div>
  <div class="board" id="board"></div>
  <div class="btn-row">
    <button class="btn btn-primary" onclick="resetGame()">&#x1F504; 重新开始</button>
    <button class="btn btn-secondary" onclick="shareResult()">&#x1F4E4; 分享PK</button>
  </div>
</div>
<div class="overlay" id="overlay">
  <div class="result-box">
    <h2>&#x1F389; 恭喜通关!</h2>
    <div class="grade" id="grade"></div>
    <p id="resultMoves"></p>
    <p id="resultTime"></p>
    <button class="btn btn-primary" onclick="shareResult();closeOverlay()">&#x1F4E4; 分享PK挑战</button>
    <button class="btn btn-secondary" onclick="resetGame();closeOverlay()" style="margin-left:8px">&#x1F504; 再来一局</button>
  </div>
</div>

const TOTAL_PAIRS = 10;
let cards = [], flippedCards = [], matchedPairs = 0, moves = 0;
let timerInterval = null, seconds = 0, gameStarted = false, gameCompleted = false;

const urlParams = new URLSearchParams(window.location.search);
const challengerName = urlParams.get('challenger') || '';
const challengerMoves = parseInt(urlParams.get('moves')) || 0;
const challengerTime = parseInt(urlParams.get('time')) || 0;

if (challengerName) {
  document.getElementById('pkBanner').classList.add('show');
  document.getElementById('pkName').textContent = challengerName + ' \u5411\u4f60\u53d1\u8d77\u4e86\u6311\u6218!';
  document.getElementById('pkResult').innerHTML =
    '<span class="pk-challenger">\u6311\u6218\u8005: ' + challengerMoves + '\u6b65 / ' + formatTime(challengerTime) + '</span>';
}

function formatTime(s) { return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); }

function createStars() {
  const c = document.getElementById('stars');
  for (let i = 0; i < 60; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.cssText = 'left:'+Math.random()*100+'%;top:'+Math.random()*100+'%;width:'+(1+Math.random()*2)+'px;height:'+(1+Math.random()*2)+'px;--dur:'+(2+Math.random()*4)+'s;animation-delay:'+Math.random()*3+'s';
    c.appendChild(s);
  }
}

function shuffle(a) { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function initGame() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  let cd = [];
  for (let i = 0; i < TOTAL_PAIRS; i++) { cd.push({id:i,portrait:PORTRAITS[i]}); cd.push({id:i,portrait:PORTRAITS[i]}); }
  cd = shuffle(cd);
  cards = []; flippedCards = []; matchedPairs = 0; moves = 0; seconds = 0;
  gameStarted = false; gameCompleted = false;
  if (timerInterval) clearInterval(timerInterval);
  document.getElementById('moves').textContent = '0';
  document.getElementById('timer').textContent = '0:00';
  document.getElementById('pairs').textContent = '0';
  cd.forEach((d,idx) => {
    const card = document.createElement('div');
    card.className = 'card'; card.dataset.id = d.id; card.dataset.idx = idx;
    card.innerHTML = '<div class="card-inner"><div class="card-face card-back"><div class="card-back-text">\u5927\u9ea6</div><div class="card-back-sub">MEMORY</div></div><div class="card-face card-front"><img src="'+d.portrait+'" alt="portrait"></div></div>';
    card.addEventListener('click', () => flipCard(card));
    board.appendChild(card);
    cards.push(card);
  });
}

function flipCard(card) {
  if (gameCompleted || card.classList.contains('flipped') || card.classList.contains('matched') || flippedCards.length >= 2) return;
  if (!gameStarted) { gameStarted = true; timerInterval = setInterval(() => { seconds++; document.getElementById('timer').textContent = formatTime(seconds); }, 1000); }
  card.classList.add('flipped');
  flippedCards.push(card);
  if (flippedCards.length === 2) {
    moves++;
    document.getElementById('moves').textContent = moves;
    const [c1,c2] = flippedCards;
    if (c1.dataset.id === c2.dataset.id) {
      setTimeout(() => { c1.classList.add('matched'); c2.classList.add('matched'); matchedPairs++; document.getElementById('pairs').textContent = matchedPairs; flippedCards = []; if (matchedPairs === TOTAL_PAIRS) gameComplete(); }, 400);
    } else {
      setTimeout(() => { c1.classList.remove('flipped'); c2.classList.remove('flipped'); flippedCards = []; }, 800);
    }
  }
}

function gameComplete() {
  gameCompleted = true; clearInterval(timerInterval);
  let grade, gc;
  if (moves<=15){grade='S';gc='grade-s';}else if(moves<=22){grade='A';gc='grade-a';}else if(moves<=30){grade='B';gc='grade-b';}else{grade='C';gc='grade-c';}
  document.getElementById('grade').textContent = grade;
  document.getElementById('grade').className = 'grade ' + gc;
  document.getElementById('resultMoves').textContent = '\ud83d\udc63 ' + moves + ' \u6b65';
  document.getElementById('resultTime').textContent = '\u23f1 ' + formatTime(seconds);
  if (challengerName) {
    document.getElementById('pkResult').innerHTML = '<span class="pk-challenger">\u6311\u6218\u8005: '+challengerMoves+'\u6b65 / '+formatTime(challengerTime)+'</span><span class="pk-you">\u4f60: '+moves+'\u6b65 / '+formatTime(seconds)+'</span>';
  }
  setTimeout(() => { document.getElementById('overlay').classList.add('show'); launchConfetti(); }, 600);
}

function launchConfetti() {
  const c = document.getElementById('confetti'); c.innerHTML = '';
  const cols = ['#f6d365','#fda085','#a18cd1','#fbc2eb','#4ade80','#60a5fa','#f472b6'];
  for (let i = 0; i < 40; i++) {
    const e = document.createElement('div'); e.className = 'confetti';
    e.style.cssText = 'left:'+Math.random()*100+'%;background:'+cols[Math.floor(Math.random()*cols.length)]+';--fall-dur:'+(1.5+Math.random()*2)+'s;animation-delay:'+Math.random()*0.5+'s;border-radius:'+(Math.random()>0.5?'50%':'2px')+';width:'+(6+Math.random()*8)+'px;height:'+(6+Math.random()*8)+'px;';
    c.appendChild(e);
  }
}

function shareResult() {
  const name = prompt('\u8bf7\u8f93\u5165\u4f60\u7684\u540d\u5b57:', '') || '\u73a9\u5bb6';
  const baseUrl = window.location.origin + window.location.pathname;
  const shareUrl = baseUrl + '?challenger=' + encodeURIComponent(name) + '&moves=' + moves + '&time=' + seconds;
  if (navigator.share) {
    navigator.share({title:'\u5927\u9ea6\u8bb0\u5fc6\u7ffb\u724c - PK\u6311\u6218',text:name+'\u7528\u4e86'+moves+'\u6b65/'+formatTime(seconds)+'\u5b8c\u6210\u4e86\u7ffb\u724c\u6e38\u620f\uff01\u6562\u6765\u6311\u6218\u5417\uff1f',url:shareUrl}).catch(()=>copyToClipboard(shareUrl));
  } else { copyToClipboard(shareUrl); }
}

function copyToClipboard(text) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(()=>alert('\u2705 PK\u94fe\u63a5\u5df2\u590d\u5236!\n\u53d1\u9001\u7ed9\u597d\u53cb\u5373\u53ef\u6311\u6218\n\n'+text));
  } else {
    const i=document.createElement('textarea');i.value=text;document.body.appendChild(i);i.select();document.execCommand('copy');document.body.removeChild(i);
    alert('\u2705 PK\u94fe\u63a5\u5df2\u590d\u5236!\n\u53d1\u9001\u7ed9\u597d\u53cb\u5373\u53ef\u6311\u6218\n\n'+text);
  }
}

function closeOverlay() { document.getElementById('overlay').classList.remove('show'); }
function resetGame() { initGame(); }
createStars();
initGame();
</script>
