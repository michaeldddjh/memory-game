<title>大麦记忆翻牌</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:linear-gradient(135deg,#0a0015 0%,#1a0030 30%,#0d0020 60%,#150028 100%);
  --card-w:calc((100vw - 50px)/8);
  --card-h:var(--card-w);
  --gap:4px;
  --gold:#ffd700;
  --accent:#c44dff;
  --pink:#ff6b9d;
  --cyan:#4dffc3;
  --blue:#6b9dff;
  --radius:10px;
}
@keyframes bgPulse{0%,100%{opacity:.3}50%{opacity:.5}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes hologram{0%{background-position:0% 50%}100%{background-position:300% 50%}}
@keyframes matchPulse{0%{transform:scale(1);box-shadow:0 0 0 rgba(77,255,195,0)}50%{transform:scale(1.06);box-shadow:0 0 20px rgba(77,255,195,.5)}100%{transform:scale(1);box-shadow:0 0 0 rgba(77,255,195,0)}}
@keyframes flipIn{0%{transform:rotateY(0)}100%{transform:rotateY(180deg)}}
@keyframes flipOut{0%{transform:rotateY(180deg)}100%{transform:rotateY(0)}}
@keyframes shake{0%,100%{transform:translateX(0) rotateY(180deg)}20%,60%{transform:translateX(-4px) rotateY(180deg)}40%,80%{transform:translateX(4px) rotateY(180deg)}}
@keyframes particleBurst{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(0)}}
@keyframes confetti{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
@keyframes slideUp{0%{transform:translateY(30px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes glow{0%,100%{text-shadow:0 0 10px rgba(255,215,0,.3)}50%{text-shadow:0 0 25px rgba(255,215,0,.7)}}
@keyframes breathe{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes starTwinkle{0%,100%{opacity:.2}50%{opacity:.8}}

body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);
  min-height:100vh;
  overflow-x:hidden;
  color:#fff;
  position:relative;
}

}

/* Starfield */
.stars{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:starTwinkle var(--dur) ease-in-out infinite;animation-delay:var(--delay)}

/* Main container */
.container{
  position:relative;z-index:1;
  max-width:480px;margin:0 auto;padding:8px 10px;
  min-height:100vh;display:flex;flex-direction:column;
}

/* Header */
.game-header{
  text-align:center;padding:6px 0 4px;
  position:relative;
}
.game-title{
  font-size:1.3em;font-weight:900;letter-spacing:2px;
  background:linear-gradient(90deg,#ff6b9d,#c44dff,#6b9dff,#4dffc3,#ffd84d,#ff6b9d);
  background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:hologram 3s linear infinite;
  filter:drop-shadow(0 0 8px rgba(196,77,255,.4));
}
.game-subtitle{font-size:.65em;color:rgba(255,255,255,.4);letter-spacing:3px;margin-top:2px}

/* Stats bar */
.stats-bar{
  display:flex;justify-content:center;gap:16px;
  padding:6px 0;margin:4px 0;
  font-size:.85em;
}
.stat{display:flex;align-items:center;gap:4px;opacity:.8}
.stat-icon{font-size:1em}
.stat-val{font-weight:700;min-width:30px;text-align:center;color:var(--gold)}

/* PK Banner */
.pk-banner{
  background:linear-gradient(135deg,rgba(255,107,157,.2),rgba(196,77,255,.2));
  border:1px solid rgba(255,107,157,.4);border-radius:var(--radius);
  padding:8px 12px;margin:4px 0;text-align:center;
  display:none;
}
.pk-banner.show{display:block;animation:slideUp .4s ease-out}
.pk-text{font-size:.8em;color:var(--pink)}
.pk-name{color:var(--gold);font-weight:700}
.pk-vs{font-size:1em;margin:4px 0;color:var(--accent)}

/* Grid */
.game-grid{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  gap:var(--gap);
  padding:4px 0;
  flex:1;
  align-content:center;
}

/* Card */
.card{
  aspect-ratio:1/1;
  perspective:600px;
  cursor:pointer;
  position:relative;z-index:1;
  animation:float 3s ease-in-out infinite;
  animation-delay:var(--ad,0s);
}
.card-inner{
  width:100%;height:100%;position:relative;
  transform-style:preserve-3d;
  transition:transform .4s cubic-bezier(.4,.0,.2,1);
}
.card.flipped .card-inner{transform:rotateY(180deg)}
.card.matched .card-inner{transform:rotateY(180deg)}

.card-face{
  position:absolute;width:100%;height:100%;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:var(--radius);overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}

/* Card Back */
.card-back{
  background:linear-gradient(135deg,#1a0040,#0d0025,#2a0060);
  border:2px solid rgba(196,167,255,.3);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
}
.card-back::before{
  content:'';position:absolute;inset:0;
  background:
    repeating-linear-gradient(45deg,transparent,transparent 6px,rgba(196,167,255,.05) 6px,rgba(196,167,255,.05) 7px),
    repeating-linear-gradient(-45deg,transparent,transparent 6px,rgba(196,167,255,.05) 6px,rgba(196,167,255,.05) 7px);
  pointer-events:none;
}
.card-back::after{content:'◆';position:absolute;top:2px;right:4px;font-size:.4em;color:rgba(255,216,77,.4)}
.corner-bl{position:absolute;bottom:2px;left:4px;font-size:.4em;color:rgba(255,216,77,.4)}
.cb-text{
  font-size:.7em;font-weight:900;letter-spacing:2px;
  background:linear-gradient(90deg,#ff6b9d,#c44dff,#6b9dff,#4dffc3,#ffd84d,#ff6b9d);
  background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:hologram 2.5s linear infinite;
  filter:drop-shadow(0 0 4px rgba(196,77,255,.3));
  z-index:1;
}
.cb-sub{font-size:.3em;color:rgba(196,167,255,.4);letter-spacing:3px;margin-top:1px;z-index:1}

/* Card Front */
.card-front{
  transform:rotateY(180deg);
  background:#fff;border:2px solid rgba(255,215,0,.3);
  padding:2px;
}
.card-front img{
  width:100%;height:100%;object-fit:cover;
  border-radius:calc(var(--radius) - 2px);
}

/* Matched card */
.card.matched{
  z-index:10;
  animation:matchPulse .6s ease-out;
}
.card.matched .card-front{
  border-color:var(--cyan);
  box-shadow:0 0 15px rgba(77,255,195,.4),inset 0 0 10px rgba(77,255,195,.1);
}
.card.matched{pointer-events:none}

/* Mismatch shake */
.card.wrong .card-inner{animation:shake .4s ease-out}

/* Particle burst on match */
.particle{
  position:absolute;width:8px;height:8px;border-radius:50%;
  pointer-events:none;z-index:100;
  animation:particleBurst .7s ease-out forwards;
}

/* Controls */
.controls{
  display:flex;gap:8px;padding:6px 0;justify-content:center;
  flex-wrap:wrap;
}
.btn{
  background:linear-gradient(135deg,rgba(196,77,255,.15),rgba(255,107,157,.15));
  border:1px solid rgba(196,77,255,.4);
  color:#fff;padding:8px 16px;border-radius:20px;
  font-size:.8em;cursor:pointer;letter-spacing:1px;
  transition:all .2s;
}
.btn:active{transform:scale(.95);background:rgba(196,77,255,.3)}
.btn-gold{
  border-color:rgba(255,215,0,.5);
  background:linear-gradient(135deg,rgba(255,215,0,.15),rgba(255,107,157,.15));
}
.btn-sm{padding:6px 12px;font-size:.7em}

/* BGM toggle */
.bgm-toggle{
  position:absolute;top:8px;right:8px;
  width:32px;height:32px;border-radius:50%;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;
  font-size:.9em;cursor:pointer;z-index:10;
}

/* Modal overlay */
.modal-overlay{
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,.7);backdrop-filter:blur(8px);
  z-index:1000;display:none;
  align-items:center;justify-content:center;
  padding:20px;
}
.modal-overlay.show{display:flex}

.modal{
  background:linear-gradient(135deg,#1a0040,#0d0025);
  border:2px solid rgba(196,167,255,.3);border-radius:20px;
  padding:24px;max-width:360px;width:100%;
  text-align:center;animation:slideUp .5s ease-out;
}
.modal-title{
  font-size:1.4em;font-weight:900;
  background:linear-gradient(90deg,var(--gold),var(--pink),var(--gold));
  background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:hologram 3s linear infinite;
  margin-bottom:12px;
}
.modal-rating{font-size:2.5em;margin:8px 0;animation:breathe 2s ease-in-out infinite}
.modal-stats{display:flex;justify-content:center;gap:20px;margin:12px 0;font-size:.9em}
.modal-stat-label{color:rgba(255,255,255,.5);font-size:.7em}
.modal-stat-val{color:var(--gold);font-weight:700;font-size:1.2em}

/* Leaderboard */
.leaderboard{margin:16px 0;text-align:left}
.lb-title{font-size:.85em;color:var(--accent);margin-bottom:6px;font-weight:700}
.lb-table{width:100%;font-size:.7em;border-collapse:collapse}
.lb-table th{color:rgba(255,255,255,.4);padding:3px 4px;font-weight:400;text-align:left;border-bottom:1px solid rgba(255,255,255,.1)}
.lb-table td{padding:3px 4px;border-bottom:1px solid rgba(255,255,255,.05)}
.lb-table .rank{color:var(--gold);font-weight:700;width:24px}
.lb-table .me{background:rgba(255,215,0,.1);border-radius:4px}
.lb-highlight{color:var(--cyan);font-weight:700}
.lb-cols{display:flex;gap:8px}
.lb-col{flex:1;min-width:0}
.lb-col .lb-title{font-size:.75em}

/* PK Result */
.pk-result{margin:10px 0;padding:8px;border-radius:var(--radius);font-size:.8em}
.pk-win{background:rgba(77,255,195,.1);border:1px solid rgba(77,255,195,.3);color:var(--cyan)}
.pk-lose{background:rgba(255,107,157,.1);border:1px solid rgba(255,107,157,.3);color:var(--pink)}

/* Name input */
.name-input{
  width:100%;padding:10px 14px;
  background:rgba(255,255,255,.08);border:1px solid rgba(196,167,255,.3);
  border-radius:12px;color:#fff;font-size:.9em;
  text-align:center;outline:none;margin:10px 0;
}
.name-input::placeholder{color:rgba(255,255,255,.3)}
.name-input:focus{border-color:var(--accent)}

/* Toast */
.toast{
  position:fixed;bottom:60px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.85);color:#fff;padding:10px 20px;
  border-radius:20px;font-size:.8em;z-index:2000;
  animation:slideUp .3s ease-out;pointer-events:none;
  border:1px solid rgba(196,167,255,.3);
}

/* Confetti canvas */
#confetti{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999}

/* Responsive */
@media(max-width:380px){
  .game-grid{gap:3px}
  .cb-text{font-size:.55em;letter-spacing:1px}
  .stats-bar{gap:10px;font-size:.75em}
  .game-title{font-size:1.1em}
}
@media(min-width:500px){
  :root{--gap:5px}
  .container{max-width:520px}
}
</style>
</head>
<body>
<div class="bg-layer"></div>
<div class="stars" id="stars"></div>
<canvas id="confetti"></canvas>

<div class="container">
  <div class="game-header">
    <div class="game-title">大麦记忆翻牌</div>
    <div class="game-subtitle">MEMORY MATCH</div>
    <div class="bgm-toggle" id="bgmToggle" onclick="toggleBGM()">🎵</div>
  </div>
  
  <div class="stats-bar" id="statsBar" style="display:none">
    <div class="stat"><span class="stat-icon">👣</span><span class="stat-val" id="stepsVal">0</span></div>
    <div class="stat"><span class="stat-icon">⏱️</span><span class="stat-val" id="timeVal">0:00</span></div>
    <div class="stat"><span class="stat-icon">🎯</span><span class="stat-val" id="matchVal">0/20</span></div>
  </div>
  
  <div class="pk-banner" id="pkBanner">
    <div class="pk-text">⚡ PK挑战：<span class="pk-name" id="pkName"></span> 用 <span id="pkSteps"></span>步 / <span id="pkTime"></span> 完成</div>
    <div class="pk-vs">你能超越吗？</div>
  </div>
  
  <div class="game-grid" id="gameGrid"></div>
  
  <div class="controls" id="gameControls">
    <button class="btn btn-gold" onclick="startGame()">🎮 开始游戏</button>
    <button class="btn btn-sm" onclick="showLeaderboard()">🏆 排行榜</button>
  </div>
</div>

<!-- Win Modal -->
<div class="modal-overlay" id="winModal">
  <div class="modal">
    <div class="modal-title">🎉 恭喜通关！</div>
    <div class="modal-rating" id="ratingEmoji"></div>
    <div class="modal-stats">
      <div><div class="modal-stat-label">步数</div><div class="modal-stat-val" id="finalSteps"></div></div>
      <div><div class="modal-stat-label">用时</div><div class="modal-stat-val" id="finalTime"></div></div>
      <div><div class="modal-stat-label">评级</div><div class="modal-stat-val" id="finalRating"></div></div>
    </div>
    <div class="pk-result" id="pkResult" style="display:none"></div>
    <input class="name-input" id="nameInput" placeholder="输入昵称上榜" maxlength="8">
    <div class="leaderboard" id="winLeaderboard"></div>
    <div class="controls">
      <button class="btn btn-gold" onclick="saveAndShare()">💾 保存 & 分享PK</button>
      <button class="btn" onclick="restartGame()">🔄 再来一局</button>
    </div>
  </div>
</div>

<!-- Leaderboard Modal -->
<div class="modal-overlay" id="lbModal">
  <div class="modal">
    <div class="modal-title">🏆 排行榜 TOP10</div>
    <div class="leaderboard" id="lbContent"></div>
    <div class="controls">
      <button class="btn" onclick="closeLb()">关闭</button>
    </div>
  </div>
</div>

const BGM_URL = "https://ppt.1ppt.com/uploads/soft/2009/2-200Z3145I5.mp3";
const PAIRS = 20;
const COLS = 8;
const ROWS = 5;

// ===== STATE =====
let cards = [];
let flippedCards = [];
let matchedPairs = 0;
let steps = 0;
let gameTimer = null;
let elapsed = 0;
let gameActive = false;
let canFlip = true;
let audioCtx = null;
let bgmAudio = null;
let bgmOn = true;

// ===== PK PARAMS =====
const urlParams = new URLSearchParams(window.location.search);
const pkName = urlParams.get('pk_name') || '';
const pkSteps = parseInt(urlParams.get('pk_steps')) || 0;
const pkTime = parseFloat(urlParams.get('pk_time')) || 0;
const isPK = pkName && pkSteps > 0;

// ===== INIT =====
window.addEventListener('DOMContentLoaded', () => {
  // PK banner setup (moved here: DOM must be ready, fmtTime must be defined)
  if (isPK) {
    document.getElementById('pkBanner').classList.add('show');
    document.getElementById('pkName').textContent = decodeURIComponent(pkName);
    document.getElementById('pkSteps').textContent = pkSteps;
    document.getElementById('pkTime').textContent = fmtTime(pkTime);
  }
  createStars();
  buildGrid();
  if (isPK) {
    startGame();
  }
});

function createStars() {
  const c = document.getElementById('stars');
  for (let i = 0; i < 50; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random()*100 + '%';
    s.style.top = Math.random()*100 + '%';
    s.style.setProperty('--dur', (2+Math.random()*4)+'s');
    s.style.setProperty('--delay', Math.random()*3+'s');
    s.style.width = s.style.height = (1+Math.random()*2)+'px';
    c.appendChild(s);
  }
}

function buildGrid() {
  const grid = document.getElementById('gameGrid');
  grid.innerHTML = '';
  // Create pairs
  cards = [];
  for (let i = 0; i < PAIRS; i++) {
    cards.push({id: i, avatar: AVATARS[i], matched: false});
    cards.push({id: i, avatar: AVATARS[i], matched: false});
  }
  shuffle(cards);
  
  cards.forEach((c, idx) => {
    const el = document.createElement('div');
    el.className = 'card';
    el.dataset.idx = idx;
    el.style.setProperty('--ad', (idx * 0.05) + 's');
    el.innerHTML = `
      <div class="card-inner">
        <div class="card-face card-back">
          <span class="corner-bl">◆</span>
          <div class="cb-text">大麦</div>
          <div class="cb-sub">MEMORY</div>
        </div>
        <div class="card-face card-front">
          <img src="${c.avatar}" alt="头像">
        </div>
      </div>`;
    el.addEventListener('click', () => flipCard(idx, el));
    grid.appendChild(el);
  });
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

// ===== GAME LOGIC =====
function startGame() {
  matchedPairs = 0;
  steps = 0;
  elapsed = 0;
  flippedCards = [];
  gameActive = true;
  canFlip = true;
  
  document.getElementById('statsBar').style.display = 'flex';
  document.getElementById('stepsVal').textContent = '0';
  document.getElementById('timeVal').textContent = '0:00';
  document.getElementById('matchVal').textContent = '0/20';
  document.getElementById('gameControls').style.display = 'none';
  
  // Reset all cards
  document.querySelectorAll('.card').forEach(c => {
    c.classList.remove('flipped','matched','wrong');
  });
  
  // Shuffle and rebuild
  shuffle(cards);
  const grid = document.getElementById('gameGrid');
  grid.innerHTML = '';
  cards.forEach((c, idx) => {
    const el = document.createElement('div');
    el.className = 'card';
    el.dataset.idx = idx;
    el.style.setProperty('--ad', (idx * 0.04) + 's');
    el.innerHTML = `
      <div class="card-inner">
        <div class="card-face card-back">
          <span class="corner-bl">◆</span>
          <div class="cb-text">大麦</div>
          <div class="cb-sub">MEMORY</div>
        </div>
        <div class="card-face card-front">
          <img src="${c.avatar}" alt="头像">
        </div>
      </div>`;
    el.addEventListener('click', () => flipCard(idx, el));
    grid.appendChild(el);
  });
  
  // Start timer
  if (gameTimer) clearInterval(gameTimer);
  gameTimer = setInterval(() => {
    elapsed++;
    document.getElementById('timeVal').textContent = fmtTime(elapsed);
  }, 1000);
  
  // Start BGM
  initAudio();
  startBGM();
}

function flipCard(idx, el) {
  if (!gameActive || !canFlip) return;
  if (el.classList.contains('flipped') || el.classList.contains('matched')) return;
  if (flippedCards.length >= 2) return;
  
  el.classList.add('flipped');
  flippedCards.push({idx, el, id: cards[idx].id});
  playSound('flip');
  
  if (flippedCards.length === 2) {
    steps++;
    document.getElementById('stepsVal').textContent = steps;
    canFlip = false;
    
    const [a, b] = flippedCards;
    if (a.id === b.id) {
      // Match!
      setTimeout(() => {
        a.el.classList.add('matched');
        b.el.classList.add('matched');
        cards[a.idx].matched = true;
        cards[b.idx].matched = true;
        matchedPairs++;
        document.getElementById('matchVal').textContent = matchedPairs + '/20';
        playSound('match');
        spawnParticles(a.el);
        spawnParticles(b.el);
        flippedCards = [];
        canFlip = true;
        
        if (matchedPairs === PAIRS) {
          gameWon();
        }
      }, 400);
    } else {
      // Mismatch
      setTimeout(() => {
        a.el.classList.add('wrong');
        b.el.classList.add('wrong');
        playSound('wrong');
      }, 400);
      setTimeout(() => {
        a.el.classList.remove('flipped','wrong');
        b.el.classList.remove('flipped','wrong');
        flippedCards = [];
        canFlip = true;
      }, 1000);
    }
  }
}

function gameWon() {
  gameActive = false;
  clearInterval(gameTimer);
  stopBGM();
  playSound('win');
  launchConfetti();
  
  // Calculate rating
  const rating = getRating(steps);
  document.getElementById('ratingEmoji').textContent = rating.emoji;
  document.getElementById('finalSteps').textContent = steps;
  document.getElementById('finalTime').textContent = fmtTime(elapsed);
  document.getElementById('finalRating').textContent = rating.letter;
  
  // PK result
  if (isPK) {
    const pkEl = document.getElementById('pkResult');
    const won = steps < pkSteps || (steps === pkSteps && elapsed < pkTime);
    pkEl.style.display = 'block';
    pkEl.className = 'pk-result ' + (won ? 'pk-win' : 'pk-lose');
    pkEl.innerHTML = won 
      ? '🎉 你赢了！你比 ' + decodeURIComponent(pkName) + ' 更快！' 
      : '💪 继续加油！' + decodeURIComponent(pkName) + ' 用了 ' + pkSteps + ' 步';
  }
  
  // Show leaderboard in win modal
  document.getElementById('winLeaderboard').innerHTML = renderLeaderboard(true);
  
  setTimeout(() => {
    document.getElementById('winModal').classList.add('show');
  }, 800);
}

function getRating(s) {
  if (s <= 28) return {letter: 'S', emoji: '🌟'};
  if (s <= 38) return {letter: 'A', emoji: '⭐'};
  if (s <= 55) return {letter: 'B', emoji: '👍'};
  return {letter: 'C', emoji: '💪'};
}

// ===== LEADERBOARD =====
function getLB() {
  try { return JSON.parse(localStorage.getItem('dm_lb') || '{"steps":[],"time":[]}'); }
  catch { return {"steps":[],"time":[]}; }
}

function saveToLB(name, steps, time) {
  const lb = getLB();
  const entry = {name, steps, time, date: new Date().toLocaleDateString('zh-CN')};
  
  lb.steps.push({...entry});
  lb.steps.sort((a,b) => a.steps - b.steps || a.time - b.time);
  lb.steps = lb.steps.slice(0, 10);
  
  lb.time.push({...entry});
  lb.time.sort((a,b) => a.time - b.time || a.steps - b.steps);
  lb.time = lb.time.slice(0, 10);
  
  localStorage.setItem('dm_lb', JSON.stringify(lb));
}

function renderLeaderboard(isWin) {
  const lb = getLB();
  if (lb.steps.length === 0 && lb.time.length === 0) {
    return '<div style="text-align:center;color:rgba(255,255,255,.3);font-size:.8em;padding:16px">暂无记录，等你来创造！</div>';
  }
  
  let html = '<div class="lb-cols">';
  
  // Steps TOP10
  html += '<div class="lb-col"><div class="lb-title">👣 最少步数 TOP10</div>';
  html += '<table class="lb-table"><tr><th>#</th><th>昵称</th><th>步数</th><th>时间</th></tr>';
  lb.steps.forEach((e, i) => {
    const highlight = isWin && e.steps === steps && e.time === elapsed ? ' class="me"' : '';
    html += `<tr${highlight}><td class="rank">${i+1}</td><td>${e.name}</td><td>${e.steps}</td><td>${fmtTime(e.time)}</td></tr>`;
  });
  html += '</table></div>';
  
  // Time TOP10
  html += '<div class="lb-col"><div class="lb-title">⏱️ 最快时间 TOP10</div>';
  html += '<table class="lb-table"><tr><th>#</th><th>昵称</th><th>时间</th><th>步数</th></tr>';
  lb.time.forEach((e, i) => {
    const highlight = isWin && e.steps === steps && e.time === elapsed ? ' class="me"' : '';
    html += `<tr${highlight}><td class="rank">${i+1}</td><td>${e.name}</td><td>${fmtTime(e.time)}</td><td>${e.steps}</td></tr>`;
  });
  html += '</table></div>';
  
  html += '</div>';
  return html;
}

function showLeaderboard() {
  document.getElementById('lbContent').innerHTML = renderLeaderboard(false);
  document.getElementById('lbModal').classList.add('show');
}

function closeLb() {
  document.getElementById('lbModal').classList.remove('show');
}

function saveAndShare() {
  const name = document.getElementById('nameInput').value.trim() || '大麦侠';
  saveToLB(name, steps, elapsed);
  
  // Generate PK link
  const base = window.location.origin + window.location.pathname;
  const pkUrl = base + '?pk_name=' + encodeURIComponent(name) + '&pk_steps=' + steps + '&pk_time=' + elapsed;
  
  // Copy to clipboard
  const shareText = '🎮 大麦记忆翻牌PK！我用' + steps + '步/' + fmtTime(elapsed) + '完成，你能超越我吗？\n' + pkUrl;
  
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(shareText).then(() => showToast('✅ 链接已复制，粘贴到微信群即可PK！'));
  } else {
    // Fallback for WeChat browser
    const ta = document.createElement('textarea');
    ta.value = shareText;
    ta.style.cssText = 'position:fixed;top:-9999px';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('✅ 链接已复制，粘贴到微信群即可PK！');
  }
  
  // Update leaderboard display
  document.getElementById('winLeaderboard').innerHTML = renderLeaderboard(true);
}

// ===== AUDIO =====
function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  
  // Init BGM
  if (!bgmAudio) {
    bgmAudio = new Audio(BGM_URL);
    bgmAudio.loop = true;
    bgmAudio.volume = 0.15;
  }
}

function startBGM() {
  if (bgmAudio && bgmOn) {
    bgmAudio.play().catch(() => {});
  }
}

function stopBGM() {
  if (bgmAudio) {
    bgmAudio.pause();
    bgmAudio.currentTime = 0;
  }
}

function toggleBGM() {
  bgmOn = !bgmOn;
  document.getElementById('bgmToggle').textContent = bgmOn ? '🎵' : '🔇';
  if (bgmOn && gameActive) {
    startBGM();
  } else {
    stopBGM();
  }
}

function playSound(type) {
  if (!audioCtx) initAudio();
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const g = audioCtx.createGain();
  g.connect(audioCtx.destination);
  
  if (type === 'flip') {
    const o = audioCtx.createOscillator();
    o.type = 'sine'; o.frequency.value = 800;
    g.gain.setValueAtTime(0.08, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
    o.connect(g); o.start(now); o.stop(now + 0.08);
  } else if (type === 'match') {
    [523, 659, 784].forEach((f, i) => {
      const o = audioCtx.createOscillator();
      const gg = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      gg.gain.setValueAtTime(0.1, now + i*0.1);
      gg.gain.exponentialRampToValueAtTime(0.001, now + i*0.1 + 0.15);
      o.connect(gg); gg.connect(audioCtx.destination);
      o.start(now + i*0.1); o.stop(now + i*0.1 + 0.15);
    });
  } else if (type === 'wrong') {
    const o = audioCtx.createOscillator();
    o.type = 'sawtooth'; o.frequency.value = 200;
    g.gain.setValueAtTime(0.06, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
    o.connect(g); o.start(now); o.stop(now + 0.2);
  } else if (type === 'win') {
    [523, 659, 784, 1047].forEach((f, i) => {
      const o = audioCtx.createOscillator();
      const gg = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      gg.gain.setValueAtTime(0.12, now + i*0.15);
      gg.gain.exponentialRampToValueAtTime(0.001, now + i*0.15 + 0.3);
      o.connect(gg); gg.connect(audioCtx.destination);
      o.start(now + i*0.15); o.stop(now + i*0.15 + 0.3);
    });
  }
}

// ===== EFFECTS =====
function spawnParticles(el) {
  const rect = el.getBoundingClientRect();
  const cx = rect.left + rect.width/2;
  const cy = rect.top + rect.height/2;
  const colors = ['#ff6b9d','#c44dff','#6b9dff','#4dffc3','#ffd84d'];
  
  for (let i = 0; i < 10; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const angle = (Math.PI * 2 / 10) * i;
    const dist = 30 + Math.random() * 40;
    p.style.cssText = `
      left:${cx}px;top:${cy}px;
      background:${colors[i % colors.length]};
      --dx:${Math.cos(angle)*dist}px;
      --dy:${Math.sin(angle)*dist}px;
    `;
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 700);
  }
}

function launchConfetti() {
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  
  const particles = [];
  const colors = ['#ff6b9d','#c44dff','#6b9dff','#4dffc3','#ffd84d','#ff4d4d','#4dff4d'];
  
  for (let i = 0; i < 80; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: -20 - Math.random() * 200,
      w: 4 + Math.random() * 6,
      h: 6 + Math.random() * 10,
      color: colors[Math.floor(Math.random() * colors.length)],
      vx: -2 + Math.random() * 4,
      vy: 2 + Math.random() * 4,
      rot: Math.random() * 360,
      vr: -5 + Math.random() * 10
    });
  }
  
  let frame = 0;
  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      p.vy += 0.05;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI / 180);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = Math.max(0, 1 - frame/120);
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
    });
    frame++;
    if (frame < 120) requestAnimationFrame(animate);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  animate();
}

function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

function restartGame() {
  document.getElementById('winModal').classList.remove('show');
  document.getElementById('gameControls').style.display = 'flex';
  startGame();
}

function fmtTime(s) {
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return m + ':' + (sec < 10 ? '0' : '') + sec;
}
