<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🃏 大麦记忆翻牌PK</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:linear-gradient(135deg,#0a0a1a 0%,#1a1040 40%,#0d1b2a 100%);
  min-height:100vh;display:flex;justify-content:center;align-items:center;
  color:#fff;overflow-x:hidden}

.game-wrap{max-width:480px;width:100%;padding:10px;text-align:center}

h1{font-size:1.4em;margin-bottom:2px;
  background:linear-gradient(90deg,#f5af19,#f12711,#f5af19);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  text-shadow:none;letter-spacing:2px}
.subtitle{font-size:.75em;color:#888;margin-bottom:8px}

.stats{display:flex;justify-content:center;gap:12px;margin:6px 0;font-size:.95em}
.stats span{background:rgba(255,255,255,.08);padding:4px 12px;border-radius:20px;
  border:1px solid rgba(255,215,0,.15)}
.stats .label{color:#888;font-size:.65em;display:block}
.stats .val{font-weight:700;font-size:1.1em;color:#ffd700}

/* 6x6 grid */
.board{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin:8px auto;
  perspective:1000px}

.card{aspect-ratio:1;cursor:pointer;position:relative;transform-style:preserve-3d;
  transition:transform .5s cubic-bezier(.4,.0,.2,1);border-radius:8px}
.card.flipped{transform:rotateY(180deg)}
.card.matched{transform:rotateY(180deg);pointer-events:none}
.card.matched .card-front{animation:matchPulse .6s ease}

@keyframes matchPulse{
  0%{box-shadow:0 0 0 0 rgba(255,215,0,.6)}
  50%{box-shadow:0 0 16px 6px rgba(255,215,0,.3)}
  100%{box-shadow:0 0 0 0 rgba(255,215,0,0)}
}

.card-face{position:absolute;inset:0;border-radius:8px;backface-visibility:hidden;
  display:flex;align-items:center;justify-content:center;overflow:hidden}

/* ====== 卡牌背面 - 炫彩扑克牌设计 ====== */
.card-back{
  background:#1a0a2e;
  border:2.5px solid #c9a84c;
  box-shadow:0 3px 14px rgba(0,0,0,.5), inset 0 0 0 1px rgba(201,168,76,.3);
  position:relative;
  background-image:
    repeating-linear-gradient(45deg,transparent,transparent 8px,rgba(201,168,76,.06) 8px,rgba(201,168,76,.06) 9px),
    repeating-linear-gradient(-45deg,transparent,transparent 8px,rgba(201,168,76,.06) 8px,rgba(201,168,76,.06) 9px),
    radial-gradient(ellipse at center,rgba(100,60,180,.15) 0%,transparent 70%);
}

/* Outer gold border line */
.card-back::before{
  content:'';position:absolute;inset:4px;border:1.5px solid rgba(201,168,76,.5);border-radius:4px;
  pointer-events:none}

/* Shimmer sweep */
.card-back::after{
  content:'';position:absolute;inset:0;border-radius:8px;
  background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.08) 45%,rgba(255,255,255,.18) 50%,rgba(255,255,255,.08) 55%,transparent 60%);
  animation:shimmer 5s ease-in-out infinite;pointer-events:none}

@keyframes shimmer{0%{transform:translateX(-150%)}100%{transform:translateX(150%)}}

/* Diamond corners */
.card-back .corner{position:absolute;width:8px;height:8px;border:1px solid rgba(201,168,76,.6);
  transform:rotate(45deg)}
.card-back .corner.tl{top:8px;left:8px}
.card-back .corner.tr{top:8px;right:8px}
.card-back .corner.bl{bottom:8px;left:8px}
.card-back .corner.br{bottom:8px;right:8px}

/* Center text container */
.card-back .center-text{
  position:relative;z-index:2;display:flex;flex-direction:column;
  align-items:center;gap:2px;pointer-events:none}

/* 炫彩大麦 art text */
.card-back .damai{
  font-family:"Kaiti SC","STKaiti","KaiTi","楷体",serif;
  font-size:1.3em;font-weight:900;letter-spacing:6px;
  background:linear-gradient(90deg,#ff3e3e,#ff8c00,#ffd700,#00ff88,#00bfff,#8b5cf6,#ff3e3e);
  background-size:300% 100%;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  animation:holoFlow 4s linear infinite;
  filter:drop-shadow(0 0 6px rgba(255,100,0,.4));
  padding:0 4px}

@keyframes holoFlow{0%{background-position:0% 50%}100%{background-position:300% 50%}}

.card-back .memory{
  font-family:Georgia,serif;font-size:.4em;letter-spacing:4px;
  color:rgba(201,168,76,.5);text-transform:uppercase}

/* ====== 卡牌正面 - 肖像 ====== */
.card-front{
  transform:rotateY(180deg);
  background:#111;border:2px solid rgba(201,168,76,.4);
  box-shadow:0 3px 14px rgba(0,0,0,.5)}
.card-front img{width:100%;height:100%;object-fit:cover;border-radius:6px}

/* ====== Login / Result screens ====== */
.overlay{position:fixed;inset:0;background:rgba(10,10,26,.95);z-index:100;
  display:flex;align-items:center;justify-content:center;
  animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.overlay-box{background:linear-gradient(135deg,#1a1040,#0d1b2a);
  border:2px solid rgba(201,168,76,.4);border-radius:16px;
  padding:28px 24px;max-width:340px;width:90%;text-align:center;
  box-shadow:0 8px 40px rgba(0,0,0,.6)}
.overlay-box h2{margin-bottom:16px;font-size:1.4em;
  background:linear-gradient(90deg,#f5af19,#f12711);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent}

.overlay-box input{
  width:100%;padding:10px;border:1px solid rgba(201,168,76,.4);border-radius:8px;
  background:rgba(255,255,255,.06);color:#fff;font-size:1em;margin-bottom:14px;outline:none}
.overlay-box input:focus{border-color:#ffd700;box-shadow:0 0 8px rgba(255,215,0,.2)}

.btn{background:linear-gradient(135deg,#f5af19,#f12711);color:#fff;border:none;
  padding:10px 28px;border-radius:20px;font-size:1em;font-weight:700;
  cursor:pointer;transition:transform .15s,box-shadow .15s;letter-spacing:1px}
.btn:hover{transform:scale(1.05);box-shadow:0 4px 20px rgba(241,39,17,.4)}
.btn:active{transform:scale(.97)}
.btn-sm{padding:6px 16px;font-size:.85em;margin:4px}

/* PK Banner */
.pk-banner{background:linear-gradient(90deg,#ff3e3e,#ff8c00);
  color:#fff;padding:8px 16px;border-radius:10px;margin-bottom:8px;
  font-weight:700;font-size:.85em;animation:pkGlow 2s ease-in-out infinite alternate}
@keyframes pkGlow{from{box-shadow:0 0 10px rgba(255,62,62,.3)}to{box-shadow:0 0 24px rgba(255,140,0,.5)}}

/* Leaderboard */
.leaderboard{margin-top:12px;text-align:left}
.leaderboard h3{color:#ffd700;font-size:.9em;margin-bottom:6px}
.lb-row{display:flex;justify-content:space-between;padding:3px 8px;
  border-radius:6px;margin:2px 0;font-size:.8em;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06)}
.lb-row.me{border-color:rgba(255,215,0,.4);background:rgba(255,215,0,.08)}
.lb-rank{color:#ffd700;font-weight:700;min-width:20px}
.lb-name{flex:1;margin:0 6px}
.lb-score{color:#aaa}

/* Confetti */
.confetti-piece{position:fixed;width:10px;height:10px;top:-20px;z-index:200;
  animation:confettiFall 3s ease-in forwards}
@keyframes confettiFall{
  0%{transform:translateY(0) rotate(0deg);opacity:1}
  100%{transform:translateY(100vh) rotate(720deg);opacity:0}}

/* Result details */
.result-detail{margin:8px 0;font-size:.9em;color:#ccc}
.result-grade{font-size:2em;margin:8px 0;line-height:1.2}
</style>
</head>
<body>
<div class="game-wrap">
  <h1>🃏 大麦记忆翻牌</h1>
  <div class="subtitle">6×6 挑战模式 · 18对肖像</div>

  <!-- PK Banner (hidden by default) -->
  <div id="pkBanner" class="pk-banner" style="display:none"></div>

  <div class="stats" id="statsBar" style="visibility:hidden">
    <span><span class="label">步数</span><span class="val" id="stepsVal">0</span></span>
    <span><span class="label">时间</span><span class="val" id="timeVal">0:00</span></span>
    <span><span class="label">配对</span><span class="val" id="matchVal">0/18</span></span>
  </div>

  <div class="board" id="board"></div>
</div>

<!-- Login Overlay -->
<div class="overlay" id="loginOverlay">
  <div class="overlay-box">
    <h2>🃏 大麦记忆翻牌</h2>
    <p style="color:#888;margin-bottom:14px;font-size:.85em">6×6 · 18对肖像 · 挑战你的记忆力</p>
    <input type="text" id="nameInput" placeholder="输入昵称开始游戏" maxlength="10" autofocus>
    <button class="btn" id="startBtn">开始游戏</button>
  </div>
</div>

<!-- Result Overlay (hidden) -->
<div class="overlay" id="resultOverlay" style="display:none">
  <div class="overlay-box">
    <h2>🎉 恭喜通关！</h2>
    <div id="pkResult"></div>
    <div class="result-detail" id="resultDetail"></div>
    <div class="result-grade" id="resultGrade"></div>
    <div style="margin:12px 0;display:flex;flex-wrap:wrap;gap:6px;justify-content:center">
      <button class="btn btn-sm" id="pkLinkBtn">🔗 生成PK链接</button>
      <button class="btn btn-sm" id="copyBtn" style="display:none">📋 复制链接</button>
      <button class="btn btn-sm" id="retryBtn">🔄 再来一局</button>
    </div>
    <div id="pkLinkText" style="display:none;margin-top:8px;padding:6px;
      background:rgba(255,255,255,.06);border-radius:8px;word-break:break-all;
      font-size:.7em;color:#888"></div>
    <div class="leaderboard" id="leaderboard"></div>
  </div>
</div>

// ====== GAME STATE ======
let playerName = '';
let cards = [];
let flippedCards = [];
let matchedCount = 0;
let steps = 0;
let timer = null;
let seconds = 0;
let gameStarted = false;
let pkData = null;

// ====== PK LINK PARSING ======
function parsePK() {
  const p = new URLSearchParams(window.location.search);
  if (p.get('pk') === 'challenge') {
    return {
      challenger: p.get('challenger') || '神秘人',
      steps: parseInt(p.get('steps')) || 0,
      time: parseInt(p.get('time')) || 0
    };
  }
  return null;
}

// ====== INIT ======
function init() {
  pkData = parsePK();
  if (pkData) {
    const banner = document.getElementById('pkBanner');
    banner.style.display = 'block';
    banner.textContent = '⚔️ ' + pkData.challenger + ' 邀请你PK！(' + pkData.steps + '步 ' + formatTime(pkData.time) + ')';
  }

  document.getElementById('startBtn').onclick = startGame;
  document.getElementById('nameInput').onkeydown = e => { if (e.key === 'Enter') startGame(); };
  document.getElementById('retryBtn').onclick = () => { document.getElementById('resultOverlay').style.display = 'none'; startGame(); };
  document.getElementById('pkLinkBtn').onclick = generatePKLink;
  document.getElementById('copyBtn').onclick = copyLink;
}

function startGame() {
  const name = document.getElementById('nameInput').value.trim() || '玩家';
  playerName = name;
  document.getElementById('loginOverlay').style.display = 'none';
  document.getElementById('statsBar').style.visibility = 'visible';
  resetGame();
  buildBoard();
  startTimer();
}

function resetGame() {
  cards = [];
  flippedCards = [];
  matchedCount = 0;
  steps = 0;
  seconds = 0;
  gameStarted = false;
  if (timer) clearInterval(timer);
  updateStats();
}

function buildBoard() {
  // Create 18 pairs (36 cards total)
  const pairs = [];
  for (let i = 0; i < 18; i++) {
    pairs.push(i, i);  // Each avatar appears twice
  }
  // Shuffle
  for (let i = pairs.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pairs[i], pairs[j]] = [pairs[j], pairs[i]];
  }

  const board = document.getElementById('board');
  board.innerHTML = '';
  cards = [];

  pairs.forEach((avatarIdx, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.idx = i;
    card.dataset.avatar = avatarIdx;
    card.onclick = () => flipCard(card);

    card.innerHTML = `
      <div class="card-face card-back">
        <div class="corner tl"></div><div class="corner tr"></div>
        <div class="corner bl"></div><div class="corner br"></div>
        <div class="center-text">
          <span class="damai">大麦</span>
          <span class="memory">MEMORY</span>
        </div>
      </div>
      <div class="card-face card-front">
        <img src="${AVATARS[avatarIdx]}" alt="肖像${avatarIdx+1}">
      </div>
    `;

    board.appendChild(card);
    cards.push(card);
  });
}

function flipCard(card) {
  if (flippedCards.length >= 2) return;
  if (card.classList.contains('flipped') || card.classList.contains('matched')) return;

  gameStarted = true;
  card.classList.add('flipped');
  flippedCards.push(card);

  if (flippedCards.length === 2) {
    steps++;
    updateStats();
    const [c1, c2] = flippedCards;
    if (c1.dataset.avatar === c2.dataset.avatar) {
      // Match!
      setTimeout(() => {
        c1.classList.add('matched');
        c2.classList.add('matched');
        matchedCount++;
        updateStats();
        flippedCards = [];
        if (matchedCount === 18) {
          endGame();
        }
      }, 300);
    } else {
      // No match - flip back
      setTimeout(() => {
        c1.classList.remove('flipped');
        c2.classList.remove('flipped');
        flippedCards = [];
      }, 800);
    }
  }
}

function startTimer() {
  timer = setInterval(() => {
    seconds++;
    document.getElementById('timeVal').textContent = formatTime(seconds);
  }, 1000);
}

function formatTime(s) {
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return m + ':' + (sec < 10 ? '0' : '') + sec;
}

function updateStats() {
  document.getElementById('stepsVal').textContent = steps;
  document.getElementById('matchVal').textContent = matchedCount + '/18';
}

function endGame() {
  clearInterval(timer);
  const grade = getGrade(steps);

  // Show result
  const detail = document.getElementById('resultDetail');
  detail.innerHTML = `用 <b style="color:#ffd700">${steps}</b> 步 · <b style="color:#ffd700">${formatTime(seconds)}</b>`;

  const gradeEl = document.getElementById('resultGrade');
  gradeEl.innerHTML = grade.icon + ' ' + grade.label;

  // PK comparison
  const pkResult = document.getElementById('pkResult');
  if (pkData) {
    const iWon = steps < pkData.steps || (steps === pkData.steps && seconds < pkData.time);
    pkResult.innerHTML = `<div style="padding:8px;border-radius:10px;margin-bottom:8px;background:${iWon ? 'rgba(0,255,100,.1)' : 'rgba(255,60,60,.1)'};border:1px solid ${iWon ? 'rgba(0,255,100,.3)' : 'rgba(255,60,60,.3)'}">
      ${iWon ? '🏆 你赢了！' : '😢 你输了...'}<br>
      <span style="font-size:.8em">${playerName}: ${steps}步 ${formatTime(seconds)} vs ${pkData.challenger}: ${pkData.steps}步 ${formatTime(pkData.time)}</span>
    </div>`;
  } else {
    pkResult.innerHTML = '';
  }

  // Save to leaderboard
  saveScore(playerName, steps, seconds);
  renderLeaderboard();

  document.getElementById('resultOverlay').style.display = 'flex';
  document.getElementById('pkLinkBtn').style.display = '';
  document.getElementById('copyBtn').style.display = 'none';
  document.getElementById('pkLinkText').style.display = 'none';

  // Confetti!
  launchConfetti();
}

function getGrade(steps) {
  if (steps <= 24) return { icon: '🧠', label: 'S · 超神记忆' };
  if (steps <= 34) return { icon: '🎯', label: 'A · 记忆高手' };
  if (steps <= 50) return { icon: '👍', label: 'B · 记忆不错' };
  return { icon: '💪', label: 'C · 继续加油' };
}

function generatePKLink() {
  const url = new URL(window.location.href);
  url.search = '';
  url.searchParams.set('pk', 'challenge');
  url.searchParams.set('challenger', playerName);
  url.searchParams.set('steps', steps);
  url.searchParams.set('time', seconds);
  const link = url.toString();

  const textEl = document.getElementById('pkLinkText');
  textEl.textContent = link;
  textEl.style.display = 'block';

  document.getElementById('pkLinkBtn').style.display = 'none';
  document.getElementById('copyBtn').style.display = '';
}

function copyLink() {
  const link = document.getElementById('pkLinkText').textContent;
  navigator.clipboard.writeText(link).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = '✅ 已复制';
    setTimeout(() => btn.textContent = '📋 复制链接', 2000);
  });
}

function saveScore(name, steps, time) {
  const scores = JSON.parse(localStorage.getItem('memory6x6_scores') || '[]');
  scores.push({ name, steps, time, date: new Date().toLocaleDateString() });
  scores.sort((a, b) => a.steps - b.steps || a.time - b.time);
  if (scores.length > 10) scores.length = 10;
  localStorage.setItem('memory6x6_scores', JSON.stringify(scores));
}

function renderLeaderboard() {
  const scores = JSON.parse(localStorage.getItem('memory6x6_scores') || '[]');
  const el = document.getElementById('leaderboard');
  if (!scores.length) { el.innerHTML = ''; return; }

  let html = '<h3>🏆 排行榜</h3>';
  scores.forEach((s, i) => {
    const isMe = s.name === playerName && s.steps === steps && s.time === seconds;
    html += `<div class="lb-row${isMe ? ' me' : ''}">
      <span class="lb-rank">${i + 1}</span>
      <span class="lb-name">${s.name}</span>
      <span class="lb-score">${s.steps}步 ${formatTime(s.time)}</span>
    </div>`;
  });
  el.innerHTML = html;
}

function launchConfetti() {
  const colors = ['#ff3e3e','#ff8c00','#ffd700','#00ff88','#00bfff','#8b5cf6','#ff69b4'];
  for (let i = 0; i < 60; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + 'vw';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDelay = Math.random() * 2 + 's';
    piece.style.animationDuration = (2 + Math.random() * 2) + 's';
    const size = 6 + Math.random() * 8;
    piece.style.width = size + 'px';
    piece.style.height = size + 'px';
    piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    document.body.appendChild(piece);
    setTimeout(() => piece.remove(), 5000);
  }
}

init();
</script>
</body>
</html>
