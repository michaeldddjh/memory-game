<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🃏 大麦记忆翻牌PK</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:linear-gradient(135deg,#0a0a1a 0%,#1a1040 40%,#0d1b2a 100%);
  min-height:100vh;display:flex;justify-content:center;align-items:center;
  color:#fff;overflow:hidden}

.game-wrap{max-width:440px;width:100%;padding:12px;text-align:center}

h1{font-size:1.5em;margin-bottom:2px;
  background:linear-gradient(90deg,#f5af19,#f12711,#f5af19);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  text-shadow:none;letter-spacing:2px}
.subtitle{font-size:.8em;color:#888;margin-bottom:10px}

.stats{display:flex;justify-content:center;gap:16px;margin:8px 0;font-size:1em}
.stats span{background:rgba(255,255,255,.08);padding:5px 14px;border-radius:20px;
  border:1px solid rgba(255,215,0,.15)}
.stats .label{color:#888;font-size:.7em;display:block}
.stats .val{font-weight:700;font-size:1.15em;color:#ffd700}

.board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px auto;
  perspective:1000px}

.card{aspect-ratio:1;cursor:pointer;position:relative;transform-style:preserve-3d;
  transition:transform .5s cubic-bezier(.4,.0,.2,1);border-radius:10px}
.card.flipped{transform:rotateY(180deg)}
.card.matched{transform:rotateY(180deg);pointer-events:none}
.card.matched .card-front{animation:matchPulse .6s ease}

@keyframes matchPulse{
  0%{box-shadow:0 0 0 0 rgba(255,215,0,.6)}
  50%{box-shadow:0 0 20px 8px rgba(255,215,0,.3)}
  100%{box-shadow:0 0 0 0 rgba(255,215,0,0)}
}

.card-face{position:absolute;inset:0;border-radius:10px;backface-visibility:hidden;
  display:flex;align-items:center;justify-content:center;overflow:hidden}

/* ====== 卡牌背面 - 炫彩扑克牌设计 ====== */
.card-back{
  background:#1a0a2e;
  border:3px solid #c9a84c;
  box-shadow:0 4px 20px rgba(0,0,0,.6), inset 0 0 0 1px rgba(201,168,76,.3);
  position:relative;
  overflow:hidden;
}

/* 外层金色粗边框 */
.card-back::before{
  content:'';position:absolute;inset:3px;
  border:2px solid rgba(201,168,76,.6);border-radius:7px;
  pointer-events:none;z-index:3;
}

/* 内层装饰框 */
.card-back::after{
  content:'';position:absolute;inset:8px;
  border:1px solid rgba(201,168,76,.35);border-radius:5px;
  pointer-events:none;z-index:3;
}

/* 深色底层纹理 - 交叉菱形图案 */
.card-back .cb-pattern{
  position:absolute;inset:0;
  background:
    repeating-linear-gradient(45deg, transparent 0px, transparent 8px, rgba(201,168,76,.06) 8px, rgba(201,168,76,.06) 9px),
    repeating-linear-gradient(-45deg, transparent 0px, transparent 8px, rgba(201,168,76,.06) 8px, rgba(201,168,76,.06) 9px);
  z-index:1;
}

/* 径向渐变叠加 */
.card-back .cb-radial{
  position:absolute;inset:0;
  background:radial-gradient(ellipse at center, rgba(120,60,200,.3) 0%, rgba(26,10,46,.9) 70%);
  z-index:1;
}

/* 四角菱形装饰 */
.card-back .cb-corner-diamond{
  position:absolute;width:18px;height:18px;z-index:4;
  border:1.5px solid rgba(201,168,76,.5);
  transform:rotate(45deg);
  background:linear-gradient(135deg, rgba(201,168,76,.15), rgba(201,168,76,.05));
}
.card-back .cb-corner-diamond.tl{top:12px;left:12px}
.card-back .cb-corner-diamond.tr{top:12px;right:12px}
.card-back .cb-corner-diamond.bl{bottom:12px;left:12px}
.card-back .cb-corner-diamond.br{bottom:12px;right:12px}

/* 中心椭圆光晕 */
.card-back .cb-glow{
  position:absolute;
  top:50%;left:50%;transform:translate(-50%,-50%);
  width:70%;height:70%;border-radius:50%;
  background:radial-gradient(ellipse, rgba(201,168,76,.12) 0%, transparent 70%);
  z-index:2;
}

/* ====== 炫彩"大麦"艺术字 ====== */
.card-back .cb-logo{
  position:relative;z-index:5;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  user-select:none;pointer-events:none;
}

/* 炫彩主文字 */
.card-back .cb-logo-text{
  font-size:2.2em;font-weight:900;letter-spacing:6px;
  font-family:"STKaiti","KaiTi","SimSun",serif;
  background:linear-gradient(
    135deg,
    #ff6b6b 0%, #ffd700 15%, #38ef7d 30%,
    #667eea 45%, #a855f7 55%, #ff6b6b 70%,
    #ffd700 85%, #38ef7d 100%
  );
  background-size:300% 300%;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  animation:holographic 4s ease-in-out infinite;
  filter:drop-shadow(0 0 8px rgba(201,168,76,.4)) drop-shadow(0 0 20px rgba(168,85,247,.2));
  line-height:1.2;
}

/* 炫彩流光动画 */
@keyframes holographic{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

/* 装饰横线 */
.card-back .cb-line{
  width:55%;height:1.5px;margin:4px 0;
  background:linear-gradient(90deg, transparent, rgba(201,168,76,.6), transparent);
}

/* 小字装饰 */
.card-back .cb-sub{
  font-size:.55em;letter-spacing:3px;
  color:rgba(201,168,76,.45);
  font-family:"STKaiti","KaiTi",serif;
}

/* 流光扫过效果 */
.card-back .cb-shimmer{
  position:absolute;inset:0;z-index:6;
  overflow:hidden;border-radius:8px;
  pointer-events:none;
}
.card-back .cb-shimmer::after{
  content:'';position:absolute;
  top:-100%;left:-100%;width:50%;height:300%;
  background:linear-gradient(105deg, transparent 40%, rgba(255,255,255,.08) 45%, rgba(255,255,255,.15) 50%, rgba(255,255,255,.08) 55%, transparent 60%);
  animation:shimmerSweep 5s ease-in-out infinite;
  transform:rotate(25deg);
}
@keyframes shimmerSweep{
  0%{top:-100%;left:-100%}
  50%{top:100%;left:100%}
  100%{top:-100%;left:-100%}
}

/* ====== 卡牌正面 - 头像 ====== */
.card-front{
  transform:rotateY(180deg);
  background:#1a1a2e;
  border:2px solid rgba(255,255,255,.15);
  box-shadow:0 4px 15px rgba(0,0,0,.4);
}
.card-front img{
  width:100%;height:100%;object-fit:cover;
  border-radius:8px;
}

/* 匹配成功的卡牌样式 */
.card.matched .card-front{
  border-color:rgba(255,215,0,.5);
  box-shadow:0 0 15px rgba(255,215,0,.2);
}

.btn{background:linear-gradient(135deg,#f5af19,#f12711);color:#fff;border:none;
  padding:10px 28px;border-radius:25px;font-size:1em;font-weight:700;
  cursor:pointer;margin:6px;transition:all .2s;letter-spacing:1px}
.btn:hover{transform:scale(1.05);box-shadow:0 4px 20px rgba(241,39,17,.4)}
.btn:active{transform:scale(.97)}
.btn.secondary{background:linear-gradient(135deg,#667eea,#764ba2)}
.btn.green{background:linear-gradient(135deg,#11998e,#38ef7d)}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;
  align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(5px)}
.modal.show{display:flex}
.modal-box{background:linear-gradient(145deg,#1a1040,#0d1b2a);border:1px solid rgba(255,215,0,.3);
  border-radius:20px;padding:30px;max-width:340px;width:90%;text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal-box h2{font-size:1.8em;margin-bottom:10px;
  background:linear-gradient(90deg,#ffd700,#ff8c00);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent}
.modal-box .grade{font-size:3em;margin:10px 0}
.modal-box .detail{color:#aaa;font-size:.9em;margin:4px 0}
.modal-box .detail b{color:#ffd700}

input[type=text]{background:rgba(255,255,255,.1);border:1px solid rgba(255,215,0,.3);
  color:#fff;padding:10px 16px;border-radius:25px;font-size:1em;width:200px;
  text-align:center;outline:none;margin:8px 0}
input[type=text]:focus{border-color:rgba(255,215,0,.6);
  box-shadow:0 0 15px rgba(255,215,0,.15)}

.leaderboard{margin-top:12px;text-align:left}
.leaderboard h3{color:#ffd700;font-size:.9em;margin-bottom:6px;text-align:center}
.lb-row{display:flex;justify-content:space-between;align-items:center;
  padding:4px 10px;border-radius:8px;margin:2px 0;font-size:.85em;
  background:rgba(255,255,255,.05)}
.lb-row .rank{color:#ffd700;font-weight:700;width:24px}
.lb-row .name{flex:1;margin:0 8px}
.lb-row .score{color:#aaa;font-size:.8em}

.pk-banner{background:linear-gradient(90deg,#ff416c,#ff4b2b);padding:8px 16px;
  border-radius:12px;margin-bottom:12px;font-size:.85em;
  animation:pkPulse 2s infinite}
@keyframes pkPulse{
  0%,100%{box-shadow:0 0 0 0 rgba(255,65,108,.4)}
  50%{box-shadow:0 0 15px 5px rgba(255,65,108,.2)}
}

.confetti{position:fixed;pointer-events:none;z-index:200}

/* (shimmer effect now handled by .cb-shimmer) */
</style>
</head>
<body>
<div class="game-wrap" id="app">
  <h1>🃏 大麦记忆翻牌</h1>
  <div class="subtitle">找出相同的头像配对</div>
  
  <div id="pkBanner" class="pk-banner" style="display:none">
    ⚔️ <span id="pkInfo"></span>
  </div>

  <div id="setupPanel">
    <input type="text" id="nameInput" placeholder="输入你的昵称" maxlength="10">
    <br>
    <button class="btn" onclick="startGame()">🚀 开始游戏</button>
  </div>

  <div id="gamePanel" style="display:none">
    <div class="stats">
      <span><span class="label">步数</span><span class="val" id="stepsVal">0</span></span>
      <span><span class="label">时间</span><span class="val" id="timeVal">0:00</span></span>
      <span><span class="label">配对</span><span class="val" id="matchVal">0/8</span></span>
    </div>
    <div class="board" id="board"></div>
  </div>

  <div class="leaderboard" id="lbSection" style="display:none">
    <h3>🏆 排行榜</h3>
    <div id="lbList"></div>
  </div>
</div>

<div class="modal" id="resultModal">
  <div class="modal-box">
    <h2 id="resultTitle">🎉 恭喜完成！</h2>
    <div class="grade" id="resultGrade"></div>
    <div class="detail">步数: <b id="resultSteps"></b></div>
    <div class="detail">用时: <b id="resultTime"></b></div>
    <div id="pkResult" style="display:none" class="detail"></div>
    <br>
    <button class="btn" onclick="generatePKLink()">🔗 生成PK链接</button>
    <button class="btn secondary" onclick="copyLink()" id="copyBtn" style="display:none">📋 复制链接</button>
    <button class="btn green" onclick="resetGame()">🔄 再玩一次</button>
    <div id="pkLinkBox" style="display:none;margin-top:10px">
      <textarea id="pkLinkText" readonly style="width:100%;height:60px;background:rgba(255,255,255,.1);
        color:#fff;border:1px solid rgba(255,215,0,.3);border-radius:8px;padding:8px;font-size:.75em;resize:none"></textarea>
    </div>
  </div>
</div>

<canvas class="confetti" id="confetti"></canvas>

let cards=[], flipped=[], matched=0, steps=0, timer=null, seconds=0, playerName='';
let pkData = null;

// Parse PK params from URL
const urlParams = new URLSearchParams(window.location.search);
if(urlParams.get('pk')==='challenge'){
  pkData = {
    challenger: urlParams.get('challenger')||'挑战者',
    steps: parseInt(urlParams.get('steps'))||0,
    time: parseInt(urlParams.get('time'))||0
  };
  document.getElementById('pkBanner').style.display='block';
  document.getElementById('pkInfo').textContent = 
    pkData.challenger+' 邀请你PK！('+pkData.steps+'步 '+pkData.time+'秒)';
}

function startGame(){
  playerName = document.getElementById('nameInput').value.trim()||'玩家';
  document.getElementById('setupPanel').style.display='none';
  document.getElementById('gamePanel').style.display='block';
  document.getElementById('lbSection').style.display='block';
  initBoard();
  timer = setInterval(()=>{
    seconds++;
    document.getElementById('timeVal').textContent=formatTime(seconds);
  },1000);
}

function initBoard(){
  // Create 8 pairs (16 cards)
  let pairs = [];
  for(let i=0;i<8;i++){
    pairs.push(i,i);
  }
  // Shuffle
  for(let i=pairs.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [pairs[i],pairs[j]]=[pairs[j],pairs[i]];
  }
  
  const board = document.getElementById('board');
  board.innerHTML = '';
  cards = [];
  flipped = [];
  matched = 0;
  steps = 0;
  seconds = 0;
  document.getElementById('stepsVal').textContent='0';
  document.getElementById('timeVal').textContent='0:00';
  document.getElementById('matchVal').textContent='0/8';
  
  pairs.forEach((avatarIdx, cardIdx)=>{
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.idx = avatarIdx;
    card.dataset.cardIdx = cardIdx;
    
    card.innerHTML = `
      <div class="card-face card-back">
        <div class="cb-pattern"></div>
        <div class="cb-radial"></div>
        <div class="cb-corner-diamond tl"></div>
        <div class="cb-corner-diamond tr"></div>
        <div class="cb-corner-diamond bl"></div>
        <div class="cb-corner-diamond br"></div>
        <div class="cb-glow"></div>
        <div class="cb-logo">
          <div class="cb-line"></div>
          <div class="cb-logo-text">大麦</div>
          <div class="cb-line"></div>
          <div class="cb-sub">MEMORY</div>
        </div>
        <div class="cb-shimmer"></div>
      </div>
      <div class="card-face card-front">
        <img src="data:image/jpeg;base64,${AVATARS[avatarIdx]}" alt="头像">
      </div>
    `;
    
    card.addEventListener('click',()=>flipCard(card));
    board.appendChild(card);
    cards.push(card);
  });
}

function flipCard(card){
  if(card.classList.contains('flipped')||card.classList.contains('matched'))return;
  if(flipped.length>=2)return;
  
  card.classList.add('flipped');
  flipped.push(card);
  
  if(flipped.length===2){
    steps++;
    document.getElementById('stepsVal').textContent=steps;
    
    const [c1,c2]=flipped;
    if(c1.dataset.idx===c2.dataset.idx){
      // Match!
      setTimeout(()=>{
        c1.classList.add('matched');
        c2.classList.add('matched');
        matched++;
        document.getElementById('matchVal').textContent=matched+'/8';
        flipped=[];
        
        if(matched===8){
          clearInterval(timer);
          setTimeout(showResult,500);
        }
      },400);
    }else{
      // No match - flip back
      setTimeout(()=>{
        c1.classList.remove('flipped');
        c2.classList.remove('flipped');
        flipped=[];
      },800);
    }
  }
}

function showResult(){
  const grade = getGrade(steps);
  const timeStr = formatTime(seconds);
  
  document.getElementById('resultSteps').textContent=steps;
  document.getElementById('resultTime').textContent=timeStr;
  document.getElementById('resultGrade').textContent=grade.emoji+' '+grade.label;
  
  // PK comparison
  if(pkData){
    const pkEl = document.getElementById('pkResult');
    pkEl.style.display='block';
    if(steps < pkData.steps || (steps===pkData.steps && seconds < pkData.time)){
      pkEl.innerHTML=`<br>⚔️ 你赢了！<br>${pkData.challenger}: ${pkData.steps}步 ${pkData.time}秒<br>你: ${steps}步 ${seconds}秒`;
      pkEl.style.color='#38ef7d';
    }else{
      pkEl.innerHTML=`<br>⚔️ ${pkData.challenger}获胜！<br>${pkData.challenger}: ${pkData.steps}步 ${pkData.time}秒<br>你: ${steps}步 ${seconds}秒`;
      pkEl.style.color='#ff416c';
    }
  }
  
  // Save to leaderboard
  saveScore(playerName, steps, seconds);
  showLeaderboard();
  
  // Show modal
  document.getElementById('resultModal').classList.add('show');
  
  // Confetti!
  launchConfetti();
}

function getGrade(s){
  if(s<=12)return{emoji:'🧠',label:'S 超神记忆'};
  if(s<=18)return{emoji:'🎯',label:'A 记忆高手'};
  if(s<=28)return{emoji:'👍',label:'B 记忆不错'};
  return{emoji:'💪',label:'C 继续加油'};
}

function formatTime(s){
  const m=Math.floor(s/60);
  const sec=s%60;
  return m+':'+(sec<10?'0':'')+sec;
}

function generatePKLink(){
  const url = window.location.origin+window.location.pathname+
    '?pk=challenge&challenger='+encodeURIComponent(playerName)+
    '&steps='+steps+'&time='+seconds;
  document.getElementById('pkLinkText').value = 
    '🃏 大麦记忆翻牌PK！我用了'+steps+'步'+seconds+'秒，你能赢我吗？\n'+url;
  document.getElementById('pkLinkBox').style.display='block';
  document.getElementById('copyBtn').style.display='inline-block';
}

function copyLink(){
  const text = document.getElementById('pkLinkText').value;
  navigator.clipboard.writeText(text).then(()=>{
    document.getElementById('copyBtn').textContent='✅ 已复制！';
    setTimeout(()=>document.getElementById('copyBtn').textContent='📋 复制链接',2000);
  }).catch(()=>{
    document.getElementById('pkLinkText').select();
    document.execCommand('copy');
  });
}

function saveScore(name, steps, time){
  let scores = JSON.parse(localStorage.getItem('memoryGameScores')||'[]');
  scores.push({name,steps,time,date:Date.now()});
  scores.sort((a,b)=>a.steps-b.steps||(a.time-b.time));
  scores = scores.slice(0,10);
  localStorage.setItem('memoryGameScores',JSON.stringify(scores));
}

function showLeaderboard(){
  const scores = JSON.parse(localStorage.getItem('memoryGameScores')||'[]');
  const list = document.getElementById('lbList');
  if(!scores.length){list.innerHTML='<div style="text-align:center;color:#666;font-size:.8em">暂无记录</div>';return;}
  list.innerHTML = scores.map((s,i)=>`
    <div class="lb-row">
      <span class="rank">${i+1}</span>
      <span class="name">${s.name}</span>
      <span class="score">${s.steps}步 ${s.time}s</span>
    </div>
  `).join('');
}

function resetGame(){
  document.getElementById('resultModal').classList.remove('show');
  document.getElementById('pkLinkBox').style.display='none';
  document.getElementById('copyBtn').style.display='none';
  clearInterval(timer);
  initBoard();
  timer = setInterval(()=>{
    seconds++;
    document.getElementById('timeVal').textContent=formatTime(seconds);
  },1000);
}

function launchConfetti(){
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  
  const particles = [];
  const colors = ['#ffd700','#ff416c','#38ef7d','#667eea','#f5af19','#ff6b6b'];
  
  for(let i=0;i<100;i++){
    particles.push({
      x: Math.random()*canvas.width,
      y: -10-Math.random()*100,
      vx: (Math.random()-.5)*4,
      vy: Math.random()*3+2,
      size: Math.random()*6+3,
      color: colors[Math.floor(Math.random()*colors.length)],
      rotation: Math.random()*360,
      rotSpeed: (Math.random()-.5)*10
    });
  }
  
  let frame = 0;
  function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    let alive = false;
    
    particles.forEach(p=>{
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.05;
      p.rotation += p.rotSpeed;
      
      if(p.y < canvas.height+20){
        alive = true;
        ctx.save();
        ctx.translate(p.x,p.y);
        ctx.rotate(p.rotation*Math.PI/180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size);
        ctx.restore();
      }
    });
    
    frame++;
    if(alive && frame<300) requestAnimationFrame(animate);
    else ctx.clearRect(0,0,canvas.width,canvas.height);
  }
  animate();
}

// Auto-focus name input
document.getElementById('nameInput').focus();
</script>
